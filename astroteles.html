    <script>
        (function () {

            window.__aivoinkoReveal = revealUi;

    <style>
        :root {
            --ink: #dce6f0;
            --ground: #020308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--ground);
            font-family: 'Rajdhani', sans-serif;
            color: var(--ink);
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0.34;
            background: radial-gradient(circle at center,
                rgba(255, 255, 255, 0.88) 0%,
                rgba(140, 178, 220, 0.42) 28%,
                rgba(8, 14, 28, 0.55) 58%,
                rgba(2, 3, 8, 1) 100%);
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding-top: 2.2vh;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        header .seal-anchor {
            pointer-events: auto;
        }

        #hint {
            position: absolute;
            left: 50%;
            bottom: calc(22vh + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 9;
            margin: 0;
            pointer-events: none;
            opacity: 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(220, 230, 240, 0.55);
            white-space: nowrap;
        }

        #fail-copy {
            display: none;
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            z-index: 8;
            width: min(28rem, calc(100% - 2.4rem));
            text-align: center;
        }

        #fail-copy p {
            font-size: 1.05rem;
            line-height: 1.5;
            color: rgba(220, 230, 240, 0.7);
        }

        .hall-closer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9;
            min-height: 0;
            padding: 0 0 calc(14px + env(safe-area-inset-bottom, 0px));
            gap: 0;
            opacity: 0;
        }

        .hall-return {
            width: 78px;
            height: 128px;
            opacity: 0.55;
        }

        .hall-return:hover,
        .hall-return:focus-visible {
            opacity: 1;
        }

        html.ui-ready header,
        html.ui-ready .hall-closer {
            opacity: 1;
        }

        html.ui-ready #fail-copy {
            display: block;
        }

        html.ui-ready #warp-flash {
            opacity: 0 !important;
        }

        @media (max-width: 768px) {
            #hint {

            .hall-return {
                width: 64px;
                height: 105px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #hint {
                opacity: 0.55;

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>

    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinkon logo" data-i18n-attr="alt:common.logoAlt" width="120" height="120" decoding="async">
    </header>
    <p id="hint" data-i18n="astroteles.hint">Vedä kiertääksesi · Vieritä äärettömyyteen</p>
    <section id="fail-copy">
        <p data-i18n="astroteles.fail">Selain ei avannut tätä avaruutta.</p>
    </section>
    <footer class="hall-closer">
        <button type="button" id="hall-return" class="hall-return" aria-label="Palaa" data-i18n-attr="aria-label:seal.return">
            <img src="AiiAold.8dde82cb.jpg" alt="" width="48" height="48" decoding="async">
        </button>
    </footer>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;
        const WRAP = 10;
        const STAR_COUNT = 520;
        const WARP_COUNT = 900;
        const ENTER_MS = 1600;
        const EXIT_MS = 780;
        const PALETTES = [
            { type: 'rocky', colors: ['#8a8a8a', '#5c5c5c', '#cfcfcf'] },
            { type: 'ice', colors: ['#9bb8c9', '#dfeaf1', '#6a8a9a'] },
            { type: 'gas', colors: ['#c4a574', '#8b5a2b', '#e6d0a8'] },
            { type: 'gas', colors: ['#6b8cae', '#3d5a80', '#b8c9e0'] },
            { type: 'rocky', colors: ['#b35a3a', '#7a2e1e', '#d08060'] }
        ];

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020308);
        scene.fog = new THREE.FogExp2(0x020308, 0.012);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.12, 6000);
        camera.position.set(0, 9, 42);

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x020308, 1);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.enableDamping = !reduceMotion;
        controls.dampingFactor = 0.055;
        controls.minPolarAngle = 0.18;
        controls.maxPolarAngle = Math.PI - 0.18;
        controls.target.set(0, 0, 0);
        controls.enabled = false;

        scene.add(new THREE.AmbientLight(0x6a7388, 0.42));
        scene.add(new THREE.HemisphereLight(0x8aa4c8, 0x08060c, 0.55));
        const keyLight = new THREE.DirectionalLight(0xf2f0ea, 0.85);
        keyLight.position.set(18, 22, 14);
        scene.add(keyLight);

        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0;
                a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function seedFor(depth, slot) {
            return (Math.imul(depth + 17, 374761393) ^ Math.imul(slot + 3, 668265263) ^ 0x9e3779b9) >>> 0;
        }

        function createPlanetTexture(type, colors, rng) {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colors[0];
            ctx.fillRect(0, 0, size, size);
            const blobs = type === 'gas' ? 90 : 160;
            for (let i = 0; i < blobs; i++) {
                ctx.globalAlpha = type === 'gas' ? 0.12 : 0.22;
                ctx.fillStyle = rng() > 0.5 ? colors[1] : colors[2];
                ctx.beginPath();
                ctx.arc(rng() * size, rng() * size, rng() * (type === 'gas' ? 28 : 8) + 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createGalaxyTexture(rng) {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size / 2;
            const spiral = rng() > 0.32;
            const arms = 2 + Math.floor(rng() * 3);
            const hue = 185 + rng() * 95;
            for (let i = 0; i < 1600; i++) {
                const t = rng();
                const r = Math.pow(t, 0.62) * (size * 0.46);
                let a = rng() * Math.PI * 2;
                if (spiral) {
                    const arm = Math.floor(rng() * arms);
                    a = arm * (Math.PI * 2 / arms) + r * 0.08 + (rng() - 0.5) * 0.4;
                }
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r * (0.52 + rng() * 0.22);
                const rad = 1.1 + rng() * 2.1;
                const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
                const alpha = 0.035 + rng() * 0.16;
                g.addColorStop(0, 'hsla(' + (hue + rng() * 36) + ', 72%, ' + (58 + rng() * 28) + '%, ' + alpha + ')');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, rad, 0, Math.PI * 2);
                ctx.fill();
            }
            const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.13);
            core.addColorStop(0, 'rgba(255,248,230,0.8)');
            core.addColorStop(0.35, 'hsla(' + hue + ', 78%, 68%, 0.32)');
            core.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = core;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function clearGroup(group) {
            while (group.children.length) {
                const child = group.children[0];
                group.remove(child);
                child.traverse(function (obj) {
                    if (obj.geometry) obj.geometry.dispose();
                    const mats = obj.material ? [].concat(obj.material) : [];
                    mats.forEach(function (m) {
                        if (m.map) m.map.dispose();
                        m.dispose();
                    });
                });
            }
            group.userData.spin = [];
            group.userData.fade = [];
        }

        function setLayerOpacity(group, opacity) {
            const fade = group.userData.fade || [];
            for (let i = 0; i < fade.length; i++) {
                fade[i].mat.opacity = fade[i].base * opacity;
            }
        }

        function layerOpacity(scale) {
            const log = Math.log(scale) / Math.log(WRAP);
            const t = Math.min(1, Math.abs(log) / 1.08);
            return Math.max(0, 1 - t * t);
        }

        function fillLayer(group, seed) {
            clearGroup(group);
            const rng = mulberry32(seed);
            const fade = [];
            const spin = [];

            const starPos = new Float32Array(STAR_COUNT * 3);
            const starCol = new Float32Array(STAR_COUNT * 3);
            for (let i = 0; i < STAR_COUNT; i++) {
                const radius = 18 + rng() * 220;
                const theta = rng() * Math.PI * 2;
                const phi = Math.acos(2 * rng() - 1);
                starPos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = radius * Math.cos(phi);
                starPos[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
                const warm = rng() > 0.78;
                const c = 0.45 + rng() * 0.55;
                starCol[i * 3] = c;
                starCol[i * 3 + 1] = warm ? c * 0.86 : c;
                starCol[i * 3 + 2] = warm ? c * 0.72 : (rng() > 0.7 ? Math.min(1, c * 1.15) : c);
            }
            const starGeom = new THREE.BufferGeometry();
            starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeom.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
            const starMat = new THREE.PointsMaterial({
                size: 0.28,
                vertexColors: true,
                transparent: true,
                opacity: 0.72,
                depthWrite: false,
                sizeAttenuation: true
            });
            const stars = new THREE.Points(starGeom, starMat);
            group.add(stars);
            fade.push({ mat: starMat, base: 0.72 });

            const galaxyCount = 2 + Math.floor(rng() * 2);
            for (let i = 0; i < galaxyCount; i++) {
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: createGalaxyTexture(rng),
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    opacity: 0.82
                }));
                const spread = 28 + rng() * 70;
                const theta = rng() * Math.PI * 2;
                const phi = Math.acos(2 * rng() - 1);
                sprite.position.set(
                    spread * Math.sin(phi) * Math.cos(theta),
                    spread * Math.cos(phi) * 0.55,
                    spread * Math.sin(phi) * Math.sin(theta)
                );
                const gSize = 22 + rng() * 38;
                sprite.scale.set(gSize, gSize * (0.55 + rng() * 0.35), 1);
                sprite.material.rotation = rng() * Math.PI;
                group.add(sprite);
                fade.push({ mat: sprite.material, base: 0.82 });
                spin.push({ obj: sprite, y: (rng() - 0.5) * 0.0007 });
            }

            const planetCount = 3 + Math.floor(rng() * 3);
            for (let i = 0; i < planetCount; i++) {
                const palette = PALETTES[Math.floor(rng() * PALETTES.length)];
                const radius = 0.35 + rng() * 1.35;
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(radius, 32, 32),
                    new THREE.MeshStandardMaterial({
                        map: createPlanetTexture(palette.type, palette.colors, rng),
                        roughness: palette.type === 'gas' ? 0.42 : 0.82,
                        metalness: 0.08,
                        transparent: true,
                        opacity: 1
                    })
                );
                const dist = 10 + rng() * 48;
                const theta = rng() * Math.PI * 2;
                const phi = Math.acos(2 * rng() - 1);
                mesh.position.set(
                    dist * Math.sin(phi) * Math.cos(theta),
                    dist * Math.cos(phi) * 0.45,
                    dist * Math.sin(phi) * Math.sin(theta)
                );
                group.add(mesh);
                fade.push({ mat: mesh.material, base: 1 });
                spin.push({ obj: mesh, y: 0.002 + rng() * 0.01 });
                if (rng() > 0.72) {
                    const ring = new THREE.Mesh(
                        new THREE.RingGeometry(radius * 1.35, radius * 2.05, 48),
                        new THREE.MeshBasicMaterial({
                            color: 0xb8a888,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.45
                        })
                    );
                    ring.rotation.x = Math.PI / 2.2;
                    ring.rotation.y = rng() * 0.4;
                    mesh.add(ring);
                    fade.push({ mat: ring.material, base: 0.45 });
                }
            }

            group.userData.fade = fade;
            group.userData.spin = spin;
        }

        const layers = [new THREE.Group(), new THREE.Group(), new THREE.Group()];
        layers.forEach(function (layer) { scene.add(layer); });

        let u = 0.18;
        let depth = 0;

        function rebuild(index, slot) {
            fillLayer(layers[index], seedFor(depth, slot));
        }

        function bootLayers() {
            rebuild(0, -1);
            rebuild(1, 0);
            rebuild(2, 1);
        }

        function applyScales() {
            for (let i = 0; i < 3; i++) {
                const scale = Math.pow(WRAP, u + i - 1);
                layers[i].scale.setScalar(scale);
                const opacity = layerOpacity(scale);
                layers[i].visible = opacity > 0.03;
                setLayerOpacity(layers[i], opacity);
            }
        }

        function wrapZoom() {
            while (u >= 1) {
                u -= 1;
                depth += 1;
                const discarded = layers[2];
                layers[2] = layers[1];
                layers[1] = layers[0];
                layers[0] = discarded;
                rebuild(0, -1);
            }
            while (u < 0) {
                u += 1;
                depth -= 1;
                const discarded = layers[0];
                layers[0] = layers[1];
                layers[1] = layers[2];
                layers[2] = discarded;
                rebuild(2, 1);
            }
            applyScales();
        }

        bootLayers();
        wrapZoom();

        function addZoom(delta) {
            u -= delta;
            wrapZoom();
        }

        renderer.domElement.addEventListener('wheel', function (event) {
            event.preventDefault();
            if (exiting || mode !== 'idle') return;
            const step = Math.sign(event.deltaY) * Math.min(Math.abs(event.deltaY), 90);
            addZoom(step * 0.00135);
        }, { passive: false });

        let pinch0 = 0;
        renderer.domElement.addEventListener('touchstart', function (event) {
            if (event.touches.length === 2) {
                controls.enableRotate = false;
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                pinch0 = Math.hypot(dx, dy);
            }
        }, { passive: true });
        renderer.domElement.addEventListener('touchend', function (event) {
            if (event.touches.length < 2) controls.enableRotate = true;
        }, { passive: true });
        renderer.domElement.addEventListener('touchcancel', function () {
            controls.enableRotate = true;
        }, { passive: true });
        renderer.domElement.addEventListener('touchmove', function (event) {
            if (event.touches.length !== 2 || exiting || mode !== 'idle') return;
            event.preventDefault();
            const dx = event.touches[0].clientX - event.touches[1].clientX;
            const dy = event.touches[0].clientY - event.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            if (pinch0 > 0 && dist > 0) {
                addZoom(-Math.log(dist / pinch0) / Math.log(WRAP));
            }
            pinch0 = dist;
        }, { passive: false });

        const warpPos = new Float32Array(WARP_COUNT * 6);
        const warpCol = new Float32Array(WARP_COUNT * 6);
        const warpZ = new Float32Array(WARP_COUNT);
        const warpXY = new Float32Array(WARP_COUNT * 2);
        function placeWarp(i) {
            const x = (Math.random() - 0.5) * 120;
            const y = (Math.random() - 0.5) * 120;
            const z = -(Math.random() * 380 + 18);
            warpXY[i * 2] = x;
            warpXY[i * 2 + 1] = y;
            warpZ[i] = z;
            const pick = Math.random();
            let r = 0.85, g = 0.9, b = 1;
            if (pick > 0.62 && pick <= 0.86) { r = 0.55; g = 0.72; b = 1; }
            else if (pick > 0.86) { r = 0.78; g = 0.78; b = 0.82; }
            warpCol[i * 6] = r;
            warpCol[i * 6 + 1] = g;
            warpCol[i * 6 + 2] = b;
            warpCol[i * 6 + 3] = r * 0.2;
            warpCol[i * 6 + 4] = g * 0.2;
            warpCol[i * 6 + 5] = b * 0.2;
        }
        for (let i = 0; i < WARP_COUNT; i++) placeWarp(i);
        const warpGeom = new THREE.BufferGeometry();
        warpGeom.setAttribute('position', new THREE.BufferAttribute(warpPos, 3));
        warpGeom.setAttribute('color', new THREE.BufferAttribute(warpCol, 3));
        const warpMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const warpMesh = new THREE.LineSegments(warpGeom, warpMat);
        warpMesh.frustumCulled = false;
        warpMesh.visible = false;
        const warpGroup = new THREE.Group();
        warpGroup.add(warpMesh);
        scene.add(warpGroup);

        function writeWarp(stretch, rush, dt) {
            for (let i = 0; i < WARP_COUNT; i++) {
                let z = warpZ[i] + rush * dt;
                if (z > 10) {
                    placeWarp(i);
                    z = warpZ[i];
                }
                warpZ[i] = z;
                const x = warpXY[i * 2];
                const y = warpXY[i * 2 + 1];
                warpPos[i * 6] = x;
                warpPos[i * 6 + 1] = y;
                warpPos[i * 6 + 2] = z;
                warpPos[i * 6 + 3] = x;
                warpPos[i * 6 + 4] = y;
                warpPos[i * 6 + 5] = z - stretch;
            }
            warpGeom.attributes.position.needsUpdate = true;
            warpGeom.attributes.color.needsUpdate = true;
        }

        const header = document.querySelector('header');
        const closer = document.querySelector('.hall-closer');
        const hint = document.getElementById('hint');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        closer.style.opacity = '0';
        hint.style.opacity = '0';

        let mode = 'enter';
        let phaseStart = 0;
        let exiting = false;
        let hintShown = 0;
        const baseFov = camera.fov;

        function showChrome() {
            const fade = reduceMotion ? 'none' : 'opacity 0.7s ease';
            header.style.transition = fade;
            closer.style.transition = fade;
            hint.style.transition = fade;
            header.style.opacity = '1';
            closer.style.opacity = '1';
            hint.style.opacity = reduceMotion ? '0.55' : '0.7';
            header.style.pointerEvents = 'auto';
            if (flash) flash.style.opacity = '0';
        }

        function hideChrome() {
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            closer.style.opacity = '0';
            hint.style.opacity = '0';
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            controls.enabled = false;
            hideChrome();
            mode = 'exit';
            phaseStart = 0;
            warpMesh.visible = !reduceMotion;
            warpMat.opacity = 0.4;
            for (let i = 0; i < WARP_COUNT; i++) placeWarp(i);
        }

        window.__aivoinkoSealExit = exitAnimation;

        window.addEventListener('pageshow', function () {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            hintShown = 0;
            u = 0.18;
            depth = 0;
            bootLayers();
            wrapZoom();
            camera.position.set(0, 9, 42);
            camera.fov = baseFov;
            camera.updateProjectionMatrix();
            controls.target.set(0, 0, 0);
            controls.enabled = false;
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            closer.style.opacity = '0';
            hint.style.opacity = '0';
            if (flash) flash.style.opacity = '0.34';
            warpMesh.visible = false;
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            if (!phaseStart) phaseStart = time;

            layers.forEach(function (layer) {
                const spin = layer.userData.spin || [];
                for (let i = 0; i < spin.length; i++) {
                    spin[i].obj.rotation.y += spin[i].y * dt;
                }
            });

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                if (!reduceMotion) {
                    warpMesh.visible = true;
                    writeWarp(8 + (1 - ease) * 70, 16 + (1 - ease) * 140, dt);
                    warpMat.opacity = 0.85 * (1 - ease);
                    warpGroup.position.copy(camera.position);
                    warpGroup.quaternion.copy(camera.quaternion);
                    camera.fov = baseFov + (1 - ease) * 18;
                    camera.updateProjectionMatrix();
                }
                if (flash) flash.style.opacity = String(0.34 * (1 - ease));
                if (progress >= 1) {
                    warpMesh.visible = false;
                    camera.fov = baseFov;
                    camera.updateProjectionMatrix();
                    controls.enabled = true;
                    showChrome();
                    hintShown = time;
                    mode = 'idle';
                }
            } else if (mode === 'idle') {
                if (!reduceMotion && hintShown && time - hintShown > 5200 && hint.style.opacity !== '0') {
                    hint.style.opacity = '0';
                }
                if (controls.enabled) controls.update();
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress;
                if (!reduceMotion) {
                    writeWarp(8 + ease * 70, 20 + ease * 160, dt);
                    warpGroup.position.copy(camera.position);
                    warpGroup.quaternion.copy(camera.quaternion);
                    warpMat.opacity = 0.4 + ease * 0.5;
                    camera.fov = baseFov + ease * 22;
                    camera.updateProjectionMatrix();
                }
                if (flash) flash.style.opacity = String(ease * 0.7);
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
