  <script>
    (function () {
      function revealUi() {
        if (window.__aivoinko3d) return;
        document.documentElement.classList.add('ui-ready');
        var loader = document.getElementById('loading');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function () {
            if (loader.parentNode) loader.remove();
          }, 1000);
        }
      }
      window.__aivoinkoReveal = revealUi;
      window.addEventListener('error', function () { revealUi(); }, true);
      window.addEventListener('unhandledrejection', function () { revealUi(); });
      setTimeout(revealUi, 2500);
    })();

  <style>
    :root {
      --glass-bg: rgba(0, 0, 0, 0.3);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-color: #ffffff;
      --accent-color: #00f3ff;
      --silver-gradient: linear-gradient(to bottom, #ffffff 0%, #c0c0c0 50%, #8a8a8a 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text-color);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 1200px;
      padding: 20px 40px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      /* Allow clicking links */
    }

    /* Desktop Layout */
    @media (min-width: 768px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .logo-container {
      text-align: center;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;

      /* Silver Gradient Text */
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;

      text-shadow: 0 0 20px rgba(192, 192, 192, 0.5);

      /* Flash Animation */
      opacity: 0;
      animation: flashEntry 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.5s;
    }

    h2.subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 4px;
      color: #aaa;
      text-transform: uppercase;
      margin-top: -5px;

      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.2s;
    }

    nav {
      display: flex;
      gap: 30px;
      margin-top: 15px;
    }

    @media (min-width: 768px) {
      nav {
        margin-top: 0;
      }
    }

    nav a {
      font-family: 'Orbitron', sans-serif;
      text-decoration: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      padding: 5px 0;
      transition: color 0.3s;

      opacity: 0;
      animation: slideIn 0.8s ease forwards;
    }

    nav a:nth-child(1) {
      animation-delay: 1.5s;
    }

    nav a:nth-child(2) {
      animation-delay: 1.7s;
    }

    nav a:hover {
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-color);
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-color);
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    nav a br {
      display: none;
    }

    /* Animations */
    @keyframes flashEntry {
      0% {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(10px);
      }

      10% {
        opacity: 1;
        filter: blur(0);
      }

      20% {
        opacity: 0.5;
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

        /* Smaller tooltip on mobile */
      }

      #tooltip-content {
        width: 180px;
        left: 20px;
        bottom: 20px;
      }
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #0f0;
      border-radius: 50%;
      box-shadow: 0 0 5px #0f0;
      animation: pulse 2s infinite;

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {

      }

      100% {
        opacity: 1;
      }

    /* Loading overlay */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {

    /* Tooltip */
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 20;
    }

    #tooltip-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 2px;
      background: var(--accent-color);
      transform-origin: 0 50%;
      transform: rotate(-45deg);
      box-shadow: 0 0 5px var(--accent-color);
    }

    #tooltip-content {
      position: absolute;
      bottom: 42px;
      /* 60 * sin(45) approx 42.4 */
      left: 42px;
      /* 60 * cos(45) approx 42.4 */
      width: 250px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-color);
      border-radius: 0 5px 5px 5px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);

    #tooltip-content h2 {
      margin-bottom: 5px;

    }

    .data-row {

      justify-content: space-between;
      margin-bottom: 3px;
      font-size: 0.85rem;

    }

    .data-value {

    html.ui-ready #loading {

          rgba(224, 64, 251, 0.8) 28%,
          rgba(255, 171, 64, 0.35) 58%,
          rgba(7, 1, 14, 1) 100%);
    }
  </style>
</head>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    window.__aivoinko3d = true;

    // --- Configuration ---
    const SCENE_CONFIG = {
      sunRadius: 5,
      speedScale: 0.5,
    };
    const FRAME_MS = 1000 / 60;

    // --- Texture Generation ---
    function createPlanetTexture(type, colors) {
      const width = 1024;
      const height = 512;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      if (type === 'gas') {
        // Gas Giant: Horizontal bands
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        colors.forEach((color, index) => {
          gradient.addColorStop(index / (colors.length - 1), color);
        });
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Add turbulence (x-wave precomputed; identical to sin(y*0.05 + sin(x*0.01)*5)*20)
        const xWave = new Float64Array(width);
        for (let x = 0; x < width; x++) {
          xWave[x] = Math.sin(x * 0.01) * 5;
        }
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        for (let y = 0; y < height; y++) {
          const yTerm = y * 0.05;
          const row = y * width;
          for (let x = 0; x < width; x++) {
            const i = (row + x) * 4;
            const n = Math.sin(yTerm + xWave[x]) * 20;
            data[i] = Math.min(255, Math.max(0, data[i] + n));
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
          }
        }
        ctx.putImageData(imageData, 0, 0);
      } else if (type === 'rocky') {
        // Rocky: Base color + noise/craters
        ctx.fillStyle = colors[0];
        ctx.fillRect(0, 0, width, height);

        // Noise
        for (let i = 0; i < 5000; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 2 + 1;
          ctx.fillStyle = Math.random() > 0.5 ? colors[1] : colors[2];
          ctx.globalAlpha = 0.1;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      } else if (type === 'earth') {
        // Earth-like: Water base, Land noise, Clouds
        ctx.fillStyle = colors[0]; // Water
        ctx.fillRect(0, 0, width, height);

        // Land
        ctx.fillStyle = colors[1]; // Land
        for (let i = 0; i < 400; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 40 + 10;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Clouds
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.4;
        for (let i = 0; i < 600; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 30 + 5;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      } else if (type === 'synthetic') {
        // Synthetic / Metallic Planet
        const gradient = ctx.createLinearGradient(0, 0, width, height);
        colors.forEach((color, index) => {
          gradient.addColorStop(index / (colors.length - 1), color);
        });
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Add metallic shine/grid pattern
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;

        // Grid lines
        for (let i = 0; i < width; i += 40) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, height);
          ctx.stroke();
        }
        for (let i = 0; i < height; i += 40) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(width, i);
          ctx.stroke();
        }

        // Random "tech" details
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        for (let i = 0; i < 50; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const w = Math.random() * 50 + 10;
          const h = Math.random() * 20 + 5;
          ctx.fillRect(x, y, w, h);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // Planet Data
    const PLANETS = [
      {
        name: "Mercury", radius: 0.8, distance: 10, speed: 4.1, type: 'rocky', colors: ['#A5A5A5', '#808080', '#D3D3D3'],
        mass: "3.30 × 10^23 kg", diameter: "4,879 km", temp: "167 °C"
      },
      {
        name: "Venus", radius: 1.5, distance: 15, speed: 1.6, type: 'gas', colors: ['#E3BB76', '#D4AF37', '#C2B280'],
        mass: "4.87 × 10^24 kg", diameter: "12,104 km", temp: "464 °C"
      },
      {
        name: "Earth", radius: 1.6, distance: 22, speed: 1.0, type: 'earth', colors: ['#1E90FF', '#228B22', '#FFFFFF'],
        mass: "5.97 × 10^24 kg", diameter: "12,742 km", temp: "15 °C"
      },
      {
        name: "Mars", radius: 0.9, distance: 30, speed: 0.53, type: 'rocky', colors: ['#DD4C22', '#B22222', '#CD5C5C'],
        mass: "6.39 × 10^23 kg", diameter: "6,779 km", temp: "-65 °C"
      },
      {
        name: "Jupiter", radius: 3.5, distance: 45, speed: 0.08, type: 'gas', colors: ['#D6A566', '#8B4513', '#F4A460', '#DEB887'],
        mass: "1.90 × 10^27 kg", diameter: "139,820 km", temp: "-110 °C"
      },
      {
        name: "Saturn", radius: 3.0, distance: 65, speed: 0.03, type: 'gas', colors: ['#F4D03F', '#DAA520', '#EEE8AA'], hasRings: true,
        mass: "5.68 × 10^26 kg", diameter: "116,460 km", temp: "-140 °C"
      },
      {
        name: "Uranus", radius: 2.0, distance: 85, speed: 0.01, type: 'gas', colors: ['#ACE5EE', '#00CED1', '#40E0D0'],
        mass: "8.68 × 10^25 kg", diameter: "50,724 km", temp: "-195 °C"
      },
      {
        name: "Neptune", radius: 1.9, distance: 100, speed: 0.006, type: 'gas', colors: ['#3F54BA', '#4169E1', '#000080'],
        mass: "1.02 × 10^26 kg", diameter: "49,244 km", temp: "-200 °C"
      },
      {
        name: "Astroteles Aivoinko II", radius: 2.5, distance: 160, speed: 0.002, type: 'synthetic', colors: ['#C0C0C0', '#E8E8E8', '#A9A9A9'],

      }
    ];

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const isMobile = window.innerWidth < 768;
    const speedMultiplier = isMobile ? 0.15 : 1.0;

    const container = document.getElementById('canvas-container');
    scene.fog = new THREE.FogExp2(0x000000, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const baseFov = camera.fov;
    const baseFogDensity = scene.fog.density;
    if (isMobile) {
      camera.position.set(0, 250, 6);
    } else {
      camera.position.set(0, 140, 280);
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);
    } catch (err) {
      console.warn('WebGL unavailable', err);
      window.__aivoinko3d = false;
      if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
      throw err;
    }

    let rafId = 0;
    function startLoop(fn) {
      if (renderer.setAnimationLoop) {
        renderer.setAnimationLoop(fn);
        return;
      }
      function tick(t) {
        fn(t);
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }
    function stopLoop() {
      if (renderer.setAnimationLoop) {
        renderer.setAnimationLoop(null);
        return;
      }
      cancelAnimationFrame(rafId);
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 600;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    controls.update();

    // --- Raycaster Setup ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let activePlanet = null;

    // --- Tooltip Elements ---
    const tooltip = document.getElementById('tooltip');
    const planetNameEl = document.getElementById('planet-name');
    const planetMassEl = document.getElementById('planet-mass');
    const planetDiameterEl = document.getElementById('planet-diameter');
    const planetTempEl = document.getElementById('planet-temp');

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0x555555);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 3, 400);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // --- Objects ---

    // 1. Sun
    function createSunTexture() {
      const width = 1024;
      const height = 512;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');

      const grad = context.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#ffcc66');
      grad.addColorStop(0.45, '#ff7700');
      grad.addColorStop(0.55, '#ff4400');
      grad.addColorStop(1, '#ffcc66');
      context.fillStyle = grad;
      context.fillRect(0, 0, width, height);

      context.strokeStyle = 'rgba(255, 220, 120, 0.45)';
      context.lineWidth = 2;
      for (let i = 0; i < 80; i++) {
        context.beginPath();
        context.moveTo(Math.random() * width, Math.random() * height);
        context.bezierCurveTo(
          Math.random() * width, Math.random() * height,
          Math.random() * width, Math.random() * height,
          Math.random() * width, Math.random() * height
        );
        context.stroke();
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createCircularLogoTexture(image) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.beginPath();
      context.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
      context.closePath();
      context.clip();
      context.drawImage(image, 0, 0, size, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const textureLoader = new THREE.TextureLoader();
    const sunGeometry = new THREE.SphereGeometry(SCENE_CONFIG.sunRadius, 48, 48);
    const sunMaterial = new THREE.MeshBasicMaterial({
      map: createSunTexture()
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // Sun Collider (Invisible, smaller sphere for precise clicking)
    const sunColliderGeometry = new THREE.SphereGeometry(SCENE_CONFIG.sunRadius * 0.9, 16, 16);
    const sunColliderMaterial = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const sunCollider = new THREE.Mesh(sunColliderGeometry, sunColliderMaterial);
    scene.add(sunCollider);

    const logoSpriteScale = SCENE_CONFIG.sunRadius * 1.7;
    const logoSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true,
      depthTest: false,
      depthWrite: false
    }));
    logoSprite.scale.set(logoSpriteScale, logoSpriteScale, 1);
    logoSprite.renderOrder = 10;
    logoSprite.visible = false;
    scene.add(logoSprite);

    textureLoader.load('AiiAold.8dde82cb.jpg',
      (texture) => {
        logoSprite.material.map = createCircularLogoTexture(texture.image);
        logoSprite.material.needsUpdate = true;
        logoSprite.visible = true;
      },
      undefined,
      (err) => {
        console.warn("Portal logo failed to load.", err);
      }
    );

    // Sun Glow
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
    gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
    gradient.addColorStop(0.2, 'rgba(255, 100, 0, 0.4)');
    gradient.addColorStop(0.5, 'rgba(255, 50, 0, 0.1)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    context.fillStyle = gradient;
    context.fillRect(0, 0, 128, 128);

    const glowTexture = new THREE.CanvasTexture(canvas);
    const glowMaterial = new THREE.SpriteMaterial({
      map: glowTexture,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const sunGlow = new THREE.Sprite(glowMaterial);
    sunGlow.scale.set(SCENE_CONFIG.sunRadius * 6, SCENE_CONFIG.sunRadius * 6, 1);
    sun.add(sunGlow);

    // 2. Stars
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 5000;
    const posArray = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 500;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starsMaterial = new THREE.PointsMaterial({
      size: 0.2,
      color: 0xffffff,
      transparent: true,
      opacity: 0.8,
    });
    const starMesh = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starMesh);

    // 3. Planets
    const planetMeshes = [];
    PLANETS.forEach(data => {
      const orbitCurve = new THREE.EllipseCurve(0, 0, data.distance, data.distance, 0, 2 * Math.PI, false, 0);
      const points = orbitCurve.getPoints(100);
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
      const orbitLine = new THREE.LineLoop(geometry, material);
      orbitLine.rotation.x = Math.PI / 2;
      scene.add(orbitLine);

      const planetGeometry = new THREE.SphereGeometry(data.radius, 64, 64);
      const texture = createPlanetTexture(data.type, data.colors);
      const planetMaterial = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: data.type === 'gas' ? 0.4 : 0.8,
        metalness: data.type === 'earth' ? 0.2 : 0.1
      });
      const planet = new THREE.Mesh(planetGeometry, planetMaterial);
      planet.position.x = data.distance;

      const pivot = new THREE.Object3D();
      pivot.rotation.y = Math.random() * Math.PI * 2;
      scene.add(pivot);
      pivot.add(planet);

      let ring = null;
      if (data.hasRings) {
        const ringGeometry = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.2, 32);
        const ringMaterial = new THREE.MeshBasicMaterial({
          color: 0xA09070,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.6
        });
        ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.y = 0.2;
        planet.add(ring);
      }

      planetMeshes.push({
        mesh: planet,
        pivot: pivot,
        speed: data.speed * SCENE_CONFIG.speedScale,
        selfRotationSpeed: 0.01 + Math.random() * 0.02,
        data: data,
        ring: ring
      });
    });

    const planetRaycastTargets = planetMeshes.map(p => p.mesh);
    const touchRaycastTargets = planetRaycastTargets.concat(sunCollider);
    const tooltipWorldPos = new THREE.Vector3();
    let displayedPlanet = null;
    let lastCursor = '';
    let tooltipVisible = false;
    let lastTooltipX = -1;
    let lastTooltipY = -1;
    let lastFrameTime = 0;

    function setCursor(cursor) {
      if (cursor === lastCursor) return;
      lastCursor = cursor;
      document.body.style.cursor = cursor;
    }

    function setTooltipVisible(visible) {
      if (tooltipVisible === visible) return;
      tooltipVisible = visible;
      tooltip.style.display = visible ? 'block' : 'none';
    }

    function updateTooltipContent(planetObj) {
      if (displayedPlanet === planetObj) return;
      displayedPlanet = planetObj;
      const data = planetObj.data;
      planetNameEl.textContent = data.name;
      planetMassEl.textContent = data.mass;
      planetDiameterEl.textContent = data.diameter;
      planetTempEl.textContent = data.temp;
    }

    // --- Transition Animation ---
    let isTransitioning = false;
    let warpState = null;

    function disposeWarp(state) {
      if (!state) return;
      if (state.warpGroup && state.warpGroup.parent) {
        state.warpGroup.parent.remove(state.warpGroup);
      }
      if (state.warpGeom) state.warpGeom.dispose();
      if (state.warpMat) state.warpMat.dispose();
    }

    function startWarpTransition() {
      if (isTransitioning) return;
      isTransitioning = true;

      const header = document.querySelector('header');
      const footer = document.querySelector('footer');
      const flash = document.getElementById('warp-flash');

      if (header) {
        header.style.transition = 'opacity 0.35s ease';
        header.style.opacity = '0';
      }
      if (footer) {
        footer.style.transition = 'opacity 0.35s ease';
        footer.style.opacity = '0';
      }
      setTooltipVisible(false);
      displayedPlanet = null;
      activePlanet = null;
      controls.enabled = false;
      starMesh.visible = false;

      const WARP_COUNT = 1600;
      const positions = new Float32Array(WARP_COUNT * 6);
      const colors = new Float32Array(WARP_COUNT * 6);
      const starZ = new Float32Array(WARP_COUNT);
      const starXY = new Float32Array(WARP_COUNT * 2);

      for (let i = 0; i < WARP_COUNT; i++) {
        const x = (Math.random() - 0.5) * 140;
        const y = (Math.random() - 0.5) * 140;
        const z = -(Math.random() * 420 + 16);
        starXY[i * 2] = x;
        starXY[i * 2 + 1] = y;
        starZ[i] = z;
        positions[i * 6] = x;
        positions[i * 6 + 1] = y;
        positions[i * 6 + 2] = z;
        positions[i * 6 + 3] = x;
        positions[i * 6 + 4] = y;
        positions[i * 6 + 5] = z;

        const pick = Math.random();
        let r = 1, g = 1, b = 1;
        if (pick > 0.55 && pick <= 0.82) {
          r = 0.88; g = 0.25; b = 0.98;
        } else if (pick > 0.82) {
          r = 1; g = 0.67; b = 0.25;
        }
        colors[i * 6] = r;
        colors[i * 6 + 1] = g;
        colors[i * 6 + 2] = b;
        colors[i * 6 + 3] = r;
        colors[i * 6 + 4] = g;
        colors[i * 6 + 5] = b;
      }

      const warpGeom = new THREE.BufferGeometry();
      warpGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      warpGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const warpMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false
      });
      const warpLines = new THREE.LineSegments(warpGeom, warpMat);
      warpLines.frustumCulled = false;
      const warpGroup = new THREE.Group();
      warpGroup.add(warpLines);
      scene.add(warpGroup);

      warpState = {
        start: 0,
        duration: 1500,
        warpGroup,
        warpGeom,
        warpMat,
        starZ,
        starXY,
        warpCount: WARP_COUNT,
        flash,
        navigated: false
      };
    }

    function stepWarp(time, dt) {
      if (!warpState || warpState.navigated) return;
      if (!warpState.start) warpState.start = time;

      const progress = Math.min((time - warpState.start) / warpState.duration, 1);
      const ease = progress * progress;

      warpState.warpGroup.position.copy(camera.position);
      warpState.warpGroup.quaternion.copy(camera.quaternion);

      const stretch = 6 + ease * 88;
      const rush = (22 + ease * 160) * dt;
      const arr = warpState.warpGeom.attributes.position.array;

      for (let i = 0; i < warpState.warpCount; i++) {
        let z = warpState.starZ[i] + rush;
        if (z > 8) {
          z = -420 - Math.random() * 80;
          warpState.starXY[i * 2] = (Math.random() - 0.5) * 140;
          warpState.starXY[i * 2 + 1] = (Math.random() - 0.5) * 140;
        }
        warpState.starZ[i] = z;
        const x = warpState.starXY[i * 2];
        const y = warpState.starXY[i * 2 + 1];
        arr[i * 6] = x;
        arr[i * 6 + 1] = y;
        arr[i * 6 + 2] = z;
        arr[i * 6 + 3] = x;
        arr[i * 6 + 4] = y;
        arr[i * 6 + 5] = z - stretch;
      }
      warpState.warpGeom.attributes.position.needsUpdate = true;
      warpState.warpMat.opacity = 0.55 + ease * 0.45;

      scene.fog.density = baseFogDensity + ease * 0.06;
      camera.fov = baseFov + ease * 52;
      camera.updateProjectionMatrix();

      if (warpState.flash) {
        const flashT = Math.max(0, (progress - 0.52) / 0.48);
        warpState.flash.style.opacity = String(flashT);
      }

      if (progress >= 1) {
        warpState.navigated = true;
        window.location.href = 'diy_realities.html';
      }
    }

    function entryAnimation() {
      const header = document.querySelector('header');
      const footer = document.querySelector('footer');

      if (header) {
        header.style.opacity = '0';
        header.style.transition = 'opacity 1.5s ease';
      }
      if (footer) {
        footer.style.opacity = '0';
        footer.style.transition = 'opacity 1.5s ease';
      }

      scene.scale.set(0.001, 0.001, 0.001);
      const startTime = Date.now();
      const duration = 1500;

      function entryLoop() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);

        scene.scale.set(ease, ease, ease);
        scene.rotation.z = (1 - ease) * -0.5;

        if (progress < 1) {
          requestAnimationFrame(entryLoop);
        } else {
          scene.scale.set(1, 1, 1);
          scene.rotation.z = 0;
          if (header) header.style.opacity = '1';
          if (footer) footer.style.opacity = '1';
        }
      }
      entryLoop();
    }

    window.addEventListener('pageshow', () => {
      isTransitioning = false;
      controls.enabled = true;
      camera.fov = baseFov;
      camera.updateProjectionMatrix();
      scene.fog.density = baseFogDensity;
      starMesh.visible = true;
      const flash = document.getElementById('warp-flash');
      if (flash) flash.style.opacity = '0';
      if (warpState) {
        disposeWarp(warpState);
        warpState = null;
      }
      entryAnimation();
    });

    function startTransition() {
      if (isTransitioning) return;
      isTransitioning = true;

      const header = document.querySelector('header');
      const footer = document.querySelector('footer');

      if (header) {
        header.style.transition = 'opacity 0.5s ease';
        header.style.opacity = '0';
      }
      if (footer) {
        footer.style.transition = 'opacity 0.5s ease';
        footer.style.opacity = '0';
      }
      setTooltipVisible(false);
      displayedPlanet = null;
      activePlanet = null;

      const startTime = Date.now();
      const duration = 1000;

      function transitionLoop() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = progress * progress * progress;
        const scale = 1 - ease;

        scene.scale.set(scale, scale, scale);
        scene.rotation.z += 0.05 * ease;

        if (progress < 1) {
          requestAnimationFrame(transitionLoop);
        } else {
          window.location.href = 'brain.html';
        }
      }
      transitionLoop();
    }

    const diyNav = document.getElementById('nav-diy');
    if (diyNav) {
      diyNav.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startWarpTransition();
      });
    }

    // --- Event Listeners (Defined here to access objects) ---
    if (!isMobile) {
      window.addEventListener('mousemove', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      });

      window.addEventListener('click', (event) => {
        if (event.target.closest && event.target.closest('a, header')) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const sunIntersects = raycaster.intersectObject(sunCollider);
        if (sunIntersects.length > 0) {
          startTransition();
        }
      });
    } else {
      window.addEventListener('touchstart', (event) => {
        if (event.target.closest && event.target.closest('a, header')) return;
        if (event.touches.length > 0) {
          const touch = event.touches[0];
          mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(touchRaycastTargets);

          if (intersects.length > 0) {
            const object = intersects[0].object;
            if (object === sunCollider) {
              startTransition();
            } else {
              const planetObj = planetMeshes.find(p => p.mesh === object);
              if (planetObj) {
                activePlanet = planetObj;
              }
            }
          } else {
            activePlanet = null;
          }
        }
      }, { passive: true });
    }

    // --- Animation Loop ---
    function animate(time) {
      const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
      lastFrameTime = time;
      const dt = Math.min(deltaMs, 50) / FRAME_MS;

      const logoPulse = 1 + Math.sin(time * 0.002) * 0.06;
      logoSprite.scale.set(logoSpriteScale * logoPulse, logoSpriteScale * logoPulse, 1);
      starMesh.rotation.y -= 0.0002 * dt;

      planetMeshes.forEach(obj => {
        obj.pivot.rotation.y += obj.speed * 0.01 * speedMultiplier * dt;
        obj.mesh.rotation.y += obj.selfRotationSpeed * dt;
      });

      if (warpState) {
        stepWarp(time, dt);
      }

      if (!isTransitioning) {
        controls.update();
      }

      // Raycasting for Hover (Desktop)
      if (!isMobile && !isTransitioning) {
        raycaster.setFromCamera(mouse, camera);
        let cursor = 'default';
        activePlanet = null;

        const sunIntersects = raycaster.intersectObject(sunCollider);
        if (sunIntersects.length > 0) {
          cursor = 'pointer';
        }

        const intersects = raycaster.intersectObjects(planetRaycastTargets);
        if (intersects.length > 0) {
          const object = intersects[0].object;
          const planetObj = planetMeshes.find(p => p.mesh === object);
          if (planetObj) {
            activePlanet = planetObj;
            cursor = 'pointer';
          }
        }
        setCursor(cursor);
      }

      // Tooltip
      if (activePlanet) {
        updateTooltipContent(activePlanet);
        setTooltipVisible(true);

        camera.updateMatrixWorld();
        activePlanet.mesh.updateMatrixWorld();
        activePlanet.mesh.getWorldPosition(tooltipWorldPos);
        tooltipWorldPos.project(camera);

        let x = (tooltipWorldPos.x * .5 + .5) * window.innerWidth;
        let y = (-(tooltipWorldPos.y * .5) + .5) * window.innerHeight;

        const padding = 10;
        x = Math.max(padding, Math.min(window.innerWidth - padding, x));
        y = Math.max(padding, Math.min(window.innerHeight - padding, y));

        if (x !== lastTooltipX || y !== lastTooltipY) {
          lastTooltipX = x;
          lastTooltipY = y;
          tooltip.style.left = `${x}px`;
          tooltip.style.top = `${y}px`;
        }
      } else {
        setTooltipVisible(false);
        displayedPlanet = null;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    startLoop(animate);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopLoop();
        lastFrameTime = 0;
      } else {
        startLoop(animate);
      }
    });

    setTimeout(() => {
      const loader = document.getElementById('loading');
      if (!loader) return;
      loader.style.opacity = '0';
      setTimeout(() => {
        if (loader.parentNode) loader.remove();
      }, 1000);
    }, 1000);

  </script>
</body>
