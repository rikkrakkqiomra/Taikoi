<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);
        })();
    </script>
    <link rel="icon" type="image/jpeg" href="AiiAold.8dde82cb.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(4, 4, 8, 0.45);
            --glass-border: rgba(196, 140, 64, 0.35);
            --text-color: #efe6d4;
            --accent-color: #c48c40;
            --bronze: #c48c40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header img {
            max-width: 120px;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(196, 140, 64, 0.28);
            transition: transform 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover {
            transform: scale(1.05);
        }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0.28;
            background: #000;
        }

        #realm-title {
            position: fixed;
            left: 50%;
            bottom: 7vh;
            transform: translateX(-50%);
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        #realm-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.2rem, 4vw, 2.4rem);
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #efe6d4;
            text-shadow: 0 0 18px rgba(196, 140, 64, 0.35);
        }

        #fallback-art {
            display: flex;
            position: fixed;
            inset: 0;
            z-index: 5;
            align-items: center;
            justify-content: center;
            padding: 140px 6vw 12vh;
            pointer-events: none;
        }

        #fallback-art.is-3d {
            display: none;
        }

        #fallback-art figure {
            max-width: min(72vw, 720px);
            max-height: 72vh;
            border: 22px solid #4a2d18;
            outline: 6px solid #b87333;
            outline-offset: -10px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65);
            background: #1a120c;
        }

        #fallback-art img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 68vh;
            object-fit: contain;
        }

        html.ui-ready header,
        html.ui-ready #realm-title {
            opacity: 1 !important;
        }

        html.ui-ready #fallback-art {
            display: flex;
        }

        html.ui-ready #fallback-art.is-3d {
            display: none;
        }

        html.ui-ready #warp-flash {
            opacity: 0 !important;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>

    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="120" height="120" fetchpriority="high" decoding="async">
    </header>

    <div id="realm-title">
        <h1>Gallery</h1>
    </div>

    <div id="fallback-art">
        <figure>
            <img src="gallery/01-elder.jpg" alt="The Elder">
        </figure>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;
        const STAR_COUNT = 2200;
        const TUNNEL_DEPTH = 900;
        const ENTER_MS = 2200;
        const EXIT_MS = 1200;
        const VIEW_GAP = 9;

        let mode = 'enter';
        let focusIndex = 0;
        let camTargetZ = 0;

        const ARTWORKS = [
            {
                src: 'gallery/01-elder.jpg',
                frame: 'wood',
                desktop: { x: 0, y: 0, z: -5.4 },
                mobile: { x: 0, y: 0, z: -4.7 }
            }
        ];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0009);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0);
        camera.fov = 92;
        camera.updateProjectionMatrix();

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        const warm = new THREE.Color(0xe8d2a0);
        const ice = new THREE.Color(0xf4f1ea);
        const dim = new THREE.Color(0x8a8fa3);

        const linePositions = new Float32Array(STAR_COUNT * 6);
        const lineColors = new Float32Array(STAR_COUNT * 6);
        const starXY = new Float32Array(STAR_COUNT * 2);
        const starZ = new Float32Array(STAR_COUNT);
        const starRGB = new Float32Array(STAR_COUNT * 3);

        function paintStarColor(i) {
            const pick = Math.random();
            let color = ice;
            if (pick > 0.42 && pick <= 0.74) color = dim;
            else if (pick > 0.74) color = warm;
            starRGB[i * 3] = color.r;
            starRGB[i * 3 + 1] = color.g;
            starRGB[i * 3 + 2] = color.b;
        }

        function placeStar(i, z) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 78;
            starXY[i * 2] = Math.cos(angle) * radius;
            starXY[i * 2 + 1] = Math.sin(angle) * radius;
            starZ[i] = z;
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            paintStarColor(i);
            const r = starRGB[i * 3];
            const g = starRGB[i * 3 + 1];
            const b = starRGB[i * 3 + 2];
            lineColors[i * 6] = r;
            lineColors[i * 6 + 1] = g;
            lineColors[i * 6 + 2] = b;
            lineColors[i * 6 + 3] = r * 0.25;
            lineColors[i * 6 + 4] = g * 0.25;
            lineColors[i * 6 + 5] = b * 0.25;
        }

        const streakGeom = new THREE.BufferGeometry();
        streakGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        streakGeom.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        const streakMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const streakMesh = new THREE.LineSegments(streakGeom, streakMat);
        streakMesh.frustumCulled = false;
        scene.add(streakMesh);

        const pointPositions = new Float32Array(STAR_COUNT * 3);
        const pointColors = new Float32Array(STAR_COUNT * 3);
        const pointsGeom = new THREE.BufferGeometry();
        pointsGeom.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointsGeom.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const pointsMat = new THREE.PointsMaterial({
            vertexColors: true,
            size: 0.55,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const pointMesh = new THREE.Points(pointsGeom, pointsMat);
        pointMesh.visible = false;
        pointMesh.frustumCulled = false;
        scene.add(pointMesh);

        function canvasTexture(draw) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            draw(canvas.getContext('2d'), 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const woodMap = canvasTexture((ctx, size) => {
            ctx.fillStyle = '#3d2414';
            ctx.fillRect(0, 0, size, size);
            for (let x = 0; x < size; x += 2) {
                const n = Math.sin(x * 0.085) * 10 + Math.sin(x * 0.31) * 4;
                ctx.strokeStyle = `rgba(${86 + (x % 28)}, ${48 + (x % 14)}, 18, 0.42)`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                for (let y = 0; y < size; y += 4) {
                    const wobble = Math.sin(y * 0.05 + x * 0.02) * 5;
                    ctx.lineTo(x + n + wobble, y);
                }
                ctx.stroke();
            }
            for (let i = 0; i < 7; i++) {
                const kx = 24 + Math.random() * 208;
                const ky = 24 + Math.random() * 208;
                const grd = ctx.createRadialGradient(kx, ky, 1, kx, ky, 11);
                grd.addColorStop(0, 'rgba(90, 48, 22, 0.9)');
                grd.addColorStop(1, 'rgba(40, 22, 10, 0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.ellipse(kx, ky, 9, 6, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }
        });
        woodMap.repeat.set(2.2, 1.1);

        const bronzeMap = canvasTexture((ctx, size) => {
            ctx.fillStyle = '#8a5520';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 2400; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const green = Math.random() > 0.82;
                ctx.fillStyle = green
                    ? `rgba(70, 140, 110, ${0.08 + Math.random() * 0.18})`
                    : `rgba(${180 + Math.random() * 50}, ${110 + Math.random() * 40}, ${40 + Math.random() * 30}, 0.22)`;
                ctx.fillRect(x, y, 1.6, 1.6);
            }
            ctx.strokeStyle = 'rgba(255, 210, 140, 0.12)';
            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * size, Math.random() * size);
                ctx.lineTo(Math.random() * size, Math.random() * size);
                ctx.stroke();
            }
        });

        const ironMap = canvasTexture((ctx, size) => {
            ctx.fillStyle = '#3c4146';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 2800; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                ctx.fillStyle = Math.random() > 0.88
                    ? `rgba(140, 62, 28, ${0.12 + Math.random() * 0.2})`
                    : `rgba(${90 + Math.random() * 50}, ${95 + Math.random() * 50}, ${100 + Math.random() * 40}, 0.2)`;
                ctx.fillRect(x, y, 1.4, 1.4);
            }
            ctx.strokeStyle = 'rgba(220, 225, 230, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 22; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * size, Math.random() * size);
                ctx.lineTo(Math.random() * size, Math.random() * size);
                ctx.stroke();
            }
        });

        function createFrameMaterial(kind) {
            if (kind === 'wood') {
                return new THREE.MeshBasicMaterial({
                    map: woodMap,
                    color: 0xc4a574,
                    fog: false
                });
            }
            if (kind === 'bronze') {
                return new THREE.MeshBasicMaterial({
                    map: bronzeMap,
                    color: 0xb87333,
                    fog: false
                });
            }
            return new THREE.MeshBasicMaterial({
                map: ironMap,
                color: 0x8a8e92,
                fog: false
            });
        }

        function addRail(group, w, h, d, x, y, z, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            group.add(mesh);
            return mesh;
        }

        function buildFrame(kind, artW, artH) {
            const group = new THREE.Group();
            const outer = createFrameMaterial(kind);
            const linerKind = kind === 'wood' ? 'bronze' : kind === 'bronze' ? 'iron' : 'bronze';
            const liner = createFrameMaterial(linerKind);
            const rail = kind === 'wood' ? 0.5 : 0.32;
            const depth = kind === 'wood' ? 0.34 : 0.2;
            const outerW = artW + rail * 2;

            addRail(group, outerW + rail * 0.18, rail, depth, 0, artH / 2 + rail / 2, 0, outer);
            addRail(group, outerW + rail * 0.18, rail, depth, 0, -(artH / 2 + rail / 2), 0, outer);
            addRail(group, rail, artH, depth, -(artW / 2 + rail / 2), 0, 0, outer);
            addRail(group, rail, artH, depth, artW / 2 + rail / 2, 0, 0, outer);

            const step = rail * 0.38;
            const stepMat = createFrameMaterial(kind);
            stepMat.color = stepMat.color.clone().multiplyScalar(0.78);
            addRail(group, artW + step * 2, step, depth * 0.62, 0, artH / 2 + step / 2, 0.06, stepMat);
            addRail(group, artW + step * 2, step, depth * 0.62, 0, -(artH / 2 + step / 2), 0.06, stepMat);
            addRail(group, step, artH, depth * 0.62, -(artW / 2 + step / 2), 0, 0.06, stepMat);
            addRail(group, step, artH, depth * 0.62, artW / 2 + step / 2, 0, 0.06, stepMat);

            const boss = rail * 1.18;
            const corners = [
                [artW / 2 + rail / 2, artH / 2 + rail / 2],
                [-(artW / 2 + rail / 2), artH / 2 + rail / 2],
                [artW / 2 + rail / 2, -(artH / 2 + rail / 2)],
                [-(artW / 2 + rail / 2), -(artH / 2 + rail / 2)]
            ];
            corners.forEach(([x, y]) => {
                const block = new THREE.Mesh(new THREE.BoxGeometry(boss, boss, depth * 1.28), outer);
                block.position.set(x, y, 0.03);
                group.add(block);
                const nub = new THREE.Mesh(new THREE.SphereGeometry(rail * 0.22, 12, 10), liner);
                nub.position.set(x, y, depth * 0.58);
                group.add(nub);
            });

            const lw = 0.075;
            addRail(group, artW + lw * 2, lw, depth * 0.5, 0, artH / 2 + lw / 2, 0.1, liner);
            addRail(group, artW + lw * 2, lw, depth * 0.5, 0, -(artH / 2 + lw / 2), 0.1, liner);
            addRail(group, lw, artH, depth * 0.5, -(artW / 2 + lw / 2), 0, 0.1, liner);
            addRail(group, lw, artH, depth * 0.5, artW / 2 + lw / 2, 0, 0.1, liner);

            return group;
        }

        const hall = new THREE.Group();
        hall.frustumCulled = false;
        scene.add(hall);

        const pieces = [];
        const fallbackArt = document.getElementById('fallback-art');

        function isMobile() {
            return window.innerWidth < 768;
        }

        function placeForSpec(spec, index) {
            if (isMobile()) {
                return spec.mobile || { x: 0, y: 0.1, z: -13.5 - index * 16 };
            }
            return spec.desktop;
        }

        function applyLayout() {
            pieces.forEach((piece, index) => {
                const pos = placeForSpec(piece.userData.spec, index);
                piece.userData.base.x = pos.x;
                piece.userData.base.y = pos.y;
                piece.userData.base.z = pos.z;
                piece.position.set(pos.x, pos.y, pos.z);
            });
            if (!isMobile()) {
                focusIndex = 0;
                camTargetZ = 0;
            } else if (pieces[focusIndex]) {
                camTargetZ = pieces[focusIndex].userData.base.z + VIEW_GAP;
            }
        }

        function blankTex() {
            const tex = new THREE.DataTexture(new Uint8Array([18, 14, 10, 255]), 1, 1);
            tex.needsUpdate = true;
            return tex;
        }

        function applyArtMap(piece, tex) {
            const img = tex.image;
            const aspect = img && img.width && img.height ? img.width / img.height : piece.userData.aspect;
            const artH = piece.userData.artH;
            const artW = artH * aspect;
            if (Math.abs(aspect - piece.userData.aspect) > 0.01) {
                piece.userData.art.geometry.dispose();
                piece.userData.art.geometry = new THREE.PlaneGeometry(artW, artH);
                piece.userData.back.geometry.dispose();
                piece.userData.back.geometry = new THREE.BoxGeometry(artW + 0.06, artH + 0.06, 0.1);
                if (piece.userData.frameGroup) {
                    piece.remove(piece.userData.frameGroup);
                }
                piece.userData.frameGroup = buildFrame(piece.userData.spec.frame, artW, artH);
                piece.add(piece.userData.frameGroup);
                piece.userData.aspect = aspect;
            }
            piece.userData.artMat.map = tex;
            piece.userData.artMat.needsUpdate = true;
            piece.userData.hasTex = true;
            if (mode === 'idle' && fallbackArt) fallbackArt.classList.add('is-3d');
        }

        function mountArtwork(spec, index, tex) {
            const img = tex && tex.image;
            const aspect = img && img.width && img.height ? img.width / img.height : 0.68;
            const artH = isMobile() ? 5.0 : 5.8;
            const artW = artH * aspect;
            const group = new THREE.Group();
            const artMat = new THREE.MeshBasicMaterial({
                map: tex,
                fog: false,
                side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(artW, artH), artMat);
            plane.position.z = 0.02;
            group.add(plane);

            const back = new THREE.Mesh(
                new THREE.BoxGeometry(artW + 0.06, artH + 0.06, 0.1),
                new THREE.MeshBasicMaterial({ color: 0x140e0a, fog: false })
            );
            back.position.z = -0.07;
            group.add(back);
            const frameGroup = buildFrame(spec.frame, artW, artH);
            group.add(frameGroup);

            const pos = placeForSpec(spec, index);
            group.position.set(pos.x, pos.y, pos.z);
            group.userData.spec = spec;
            group.userData.base = { x: pos.x, y: pos.y, z: pos.z, phase: index * 1.7 };
            group.userData.art = plane;
            group.userData.artMat = artMat;
            group.userData.back = back;
            group.userData.frameGroup = frameGroup;
            group.userData.artH = artH;
            group.userData.aspect = aspect;
            group.frustumCulled = false;
            plane.frustumCulled = false;
            hall.add(group);
            pieces[index] = group;
            applyLayout();
            return group;
        }

        const loader = new THREE.TextureLoader();
        ARTWORKS.forEach((spec, index) => {
            const piece = mountArtwork(spec, index, blankTex());
            loader.load(
                spec.src,
                (tex) => applyArtMap(piece, tex),
                undefined,
                () => console.warn('Gallery artwork failed to load.', spec.src)
            );
        });

        const header = document.querySelector('header');
        const titleEl = document.getElementById('realm-title');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        titleEl.style.opacity = '0';
        header.style.pointerEvents = 'none';

        let phaseStart = 0;
        let exiting = false;
        const baseFov = 70;

        function writeStreaks(stretch, rush, dt) {
            const arr = streakGeom.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 12) {
                    placeStar(i, -TUNNEL_DEPTH - Math.random() * 80);
                    z = starZ[i];
                }
                starZ[i] = z;
                const x = starXY[i * 2];
                const y = starXY[i * 2 + 1];
                arr[i * 6] = x;
                arr[i * 6 + 1] = y;
                arr[i * 6 + 2] = z;
                arr[i * 6 + 3] = x;
                arr[i * 6 + 4] = y;
                arr[i * 6 + 5] = z - stretch;
            }
            streakGeom.attributes.position.needsUpdate = true;
        }

        function settlePoints() {
            for (let i = 0; i < STAR_COUNT; i++) {
                pointPositions[i * 3] = starXY[i * 2];
                pointPositions[i * 3 + 1] = starXY[i * 2 + 1];
                pointPositions[i * 3 + 2] = starZ[i];
                pointColors[i * 3] = starRGB[i * 3];
                pointColors[i * 3 + 1] = starRGB[i * 3 + 1];
                pointColors[i * 3 + 2] = starRGB[i * 3 + 2];
            }
            pointsGeom.attributes.position.needsUpdate = true;
            pointsGeom.attributes.color.needsUpdate = true;
            pointMesh.visible = true;
        }

        function driftPoints(dt, rush) {
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 8) {
                    placeStar(i, -TUNNEL_DEPTH - Math.random() * 80);
                    z = starZ[i];
                }
                starZ[i] = z;
                pointPositions[i * 3] = starXY[i * 2];
                pointPositions[i * 3 + 1] = starXY[i * 2 + 1];
                pointPositions[i * 3 + 2] = z;
            }
            pointsGeom.attributes.position.needsUpdate = true;
        }

        function poseHangings(time, arrive) {
            pieces.forEach((piece) => {
                if (!piece) return;
                const base = piece.userData.base;
                const fly = 1 - arrive;
                piece.position.x = base.x;
                piece.position.y = base.y + (time ? Math.sin(time * 0.00075 + base.phase) * 0.12 * arrive : 0);
                piece.position.z = base.z - 18 * fly;
                piece.rotation.y = time ? Math.sin(time * 0.00032 + base.phase) * 0.035 * arrive : 0;
                piece.rotation.x = time ? Math.sin(time * 0.00026 + base.phase) * 0.018 * arrive : 0;
                piece.visible = true;
            });
        }

        poseHangings(0, 0);

        function setFocus(next) {
            if (!pieces.length) return;
            const max = pieces.length - 1;
            focusIndex = Math.max(0, Math.min(max, next));
            if (isMobile() && pieces[focusIndex]) {
                camTargetZ = pieces[focusIndex].userData.base.z + VIEW_GAP;
            }
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            header.style.pointerEvents = 'none';
            mode = 'exit';
            phaseStart = 0;
            pointMesh.visible = false;
            streakMesh.visible = true;
            for (let i = 0; i < STAR_COUNT; i++) {
                if (starZ[i] > -20) placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            }
        }

        header.style.cursor = 'pointer';
        header.addEventListener('click', exitAnimation);

        let touchX = null;
        window.addEventListener('touchstart', (event) => {
            if (event.target.closest && event.target.closest('header')) return;
            if (event.touches.length === 1) touchX = event.touches[0].clientX;
        }, { passive: true });
        window.addEventListener('touchend', (event) => {
            if (touchX == null || mode !== 'idle') {
                touchX = null;
                return;
            }
            const endX = event.changedTouches[0] ? event.changedTouches[0].clientX : touchX;
            const dx = endX - touchX;
            touchX = null;
            if (Math.abs(dx) < 48 || pieces.length < 2) return;
            setFocus(focusIndex + (dx < 0 ? 1 : -1));
        }, { passive: true });

        window.addEventListener('pageshow', () => {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            focusIndex = 0;
            camTargetZ = 0;
            camera.position.set(0, 0, 0);
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            titleEl.style.opacity = '0';
            camera.fov = 92;
            camera.updateProjectionMatrix();
            hall.scale.setScalar(1);
            applyLayout();
            poseHangings(0, 0);
            pointMesh.visible = false;
            streakMesh.visible = true;
            pointsMat.opacity = 0;
            streakMat.opacity = 1;
            if (flash) flash.style.opacity = '0.28';
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            if (!phaseStart) phaseStart = time;

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const warpLeft = 1 - easeOut;
                writeStreaks(8 + warpLeft * 95, 40 + warpLeft * 420, dt);

                camera.fov = 92 - easeOut * 22;
                camera.updateProjectionMatrix();
                scene.fog.density = 0.0009 + easeOut * 0.0016;

                if (flash) flash.style.opacity = String(Math.max(0, 0.28 * (1 - Math.min((time - phaseStart) / 350, 1))));

                const hallT = Math.max(0, (progress - 0.28) / 0.72);
                const hallEase = 1 - Math.pow(1 - hallT, 3);
                poseHangings(time, hallEase);

                if (progress >= 1) {
                    settlePoints();
                    streakMesh.visible = false;
                    pointsMat.opacity = 0.9;
                    header.style.transition = 'opacity 1.1s ease';
                    titleEl.style.transition = 'opacity 1.4s ease';
                    header.style.opacity = '1';
                    titleEl.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    applyLayout();
                    poseHangings(time, 1);
                    if (flash) flash.style.opacity = '0';
                    mode = 'idle';
                    if (fallbackArt && pieces.some((p) => p && p.userData.hasTex)) {
                        fallbackArt.classList.add('is-3d');
                    }
                }
            } else if (mode === 'idle') {
                driftPoints(dt, 0.42);
                poseHangings(time, 1);
                camera.position.z += (camTargetZ - camera.position.z) * Math.min(1, 0.045 * dt);
                if (pieces[focusIndex]) {
                    const base = pieces[focusIndex].userData.base;
                    camera.lookAt(base.x, base.y, base.z);
                }
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress * progress;
                writeStreaks(8 + ease * 110, 60 + ease * 520, dt);
                streakMat.opacity = 0.55 + ease * 0.45;
                camera.fov = baseFov + ease * 48;
                camera.updateProjectionMatrix();
                poseHangings(time, 1 - ease);
                header.style.opacity = String(1 - ease);
                titleEl.style.opacity = String(1 - ease);
                if (flash) flash.style.opacity = String(Math.max(0, (progress - 0.4) / 0.6));
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            applyLayout();
        });
    </script>
</body>

</html>
