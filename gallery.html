<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);
        })();
    </script>
    <link rel="icon" type="image/jpeg" href="AiiAold.8dde82cb.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(4, 4, 8, 0.45);
            --glass-border: rgba(196, 140, 64, 0.35);
            --text-color: #efe6d4;
            --accent-color: #c48c40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header img {
            max-width: 120px;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(196, 140, 64, 0.28);
            transition: transform 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover {
            transform: scale(1.05);
        }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0.28;
            background: #000;
        }

        #realm-title {
            position: static;
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            margin-top: 4vh;
        }

        #realm-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.1rem, 3.6vw, 2.1rem);
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #efe6d4;
            text-shadow: 0 0 18px rgba(196, 140, 64, 0.35);
        }

        #hall {
            position: fixed;
            inset: 0;
            z-index: 5;
            overflow-x: hidden;
            overflow-y: auto;
            pointer-events: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(196, 140, 64, 0.35) transparent;
        }

        .bay {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .bay--pair {
            gap: 4vw;
            padding: 156px 4vw 6vh;
        }

        .bay--hero {
            flex-direction: column;
            padding: 6vh 3vw 7vh;
        }

        .hanging {
            flex: 0 0 auto;
            width: auto;
            height: 62vh;
            --hang-y: 0px;
            animation: hangIn 1.05s ease both, hangDrift 10s ease-in-out 1.05s infinite;
        }

        .bay--pair .hanging:nth-child(1) {
            --hang-y: -6px;
        }

        .bay--pair .hanging:nth-child(2) {
            --hang-y: 6px;
        }

        .hanging--hero {
            height: 86vh;
            --hang-y: 0px;
        }

        .hanging--square {
            height: min(86vh, 78vw);
        }

        .hanging.is-off {
            display: none;
        }

        .hanging img {
            display: block;
            width: auto;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(10px 16px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 16px rgba(196, 140, 64, 0.12));
        }

        .bay--pair .hanging:nth-child(2) img {
            filter: drop-shadow(10px 16px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 14px rgba(160, 120, 72, 0.14));
        }

        .hanging--hero img {
            filter: drop-shadow(12px 20px 18px rgba(0, 0, 0, 0.62)) drop-shadow(0 0 20px rgba(168, 142, 88, 0.18));
        }

        .hanging--finale img {
            filter: drop-shadow(12px 20px 18px rgba(0, 0, 0, 0.62)) drop-shadow(0 0 12px rgba(80, 70, 55, 0.14));
        }

        .hanging--square img {
            filter: drop-shadow(12px 20px 18px rgba(0, 0, 0, 0.58)) drop-shadow(0 0 16px rgba(196, 154, 72, 0.16));
        }

        .hanging--ivory img {
            filter: drop-shadow(12px 20px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 20px rgba(196, 154, 82, 0.2));
        }

        @keyframes hangIn {
            from {
                opacity: 0;
                transform: translateY(calc(var(--hang-y) + 14px)) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(var(--hang-y));
            }
        }

        @keyframes hangDrift {
            0%,
            100% {
                transform: translateY(var(--hang-y));
            }

            50% {
                transform: translateY(calc(var(--hang-y) - 10px));
            }
        }

        @media (max-width: 768px) {
            #hall {
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                padding: 148px 5vw 14vh;
            }

            .bay {
                min-height: 0;
                display: contents;
                padding: 0;
            }

            .hanging,
            .hanging--hero,
            .hanging--ivory {
                width: min(86vw, 62vh);
                height: auto;
                max-width: min(86vw, 62vh);
                max-height: calc(100vh - 148px - 14vh);
                --hang-y: 0px;
                animation-delay: 0s, 1.05s;
            }

            .hanging--square {
                width: min(82vw, 62vh, calc(100vh - 160px - 14vh));
                max-width: min(82vw, 62vh, calc(100vh - 160px - 14vh));
                max-height: calc(100vh - 160px - 14vh);
            }

            .hanging img {
                width: 100%;
                height: auto;
                max-height: calc(100vh - 148px - 14vh);
            }

            #realm-title {
                position: fixed;
                left: 50%;
                bottom: 6vh;
                transform: translateX(-50%);
                margin-top: 0;
            }
        }

        html.ui-ready header,
        html.ui-ready #realm-title,
        html.ui-ready #hall {
            opacity: 1 !important;
        }

        html.ui-ready #warp-flash {
            opacity: 0 !important;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>

    <div id="hall">
        <header>
            <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="120" height="120" fetchpriority="high" decoding="async">
        </header>
        <section class="bay bay--pair">
            <figure class="hanging">
                <img src="art/hangings/01-elder-gilt.png" alt="The Elder" decoding="async">
            </figure>
            <figure class="hanging">
                <img src="art/hangings/02-nautilus-walnut.png" alt="The Nautilus" decoding="async">
            </figure>
        </section>
        <section class="bay bay--hero">
            <figure class="hanging hanging--hero">
                <img src="art/hangings/03-altar-bronze.png" alt="The Altar" decoding="async">
            </figure>
        </section>
        <section class="bay bay--hero">
            <figure class="hanging hanging--hero hanging--finale">
                <img src="art/hangings/04-throne-dark.png" alt="The Throne" decoding="async">
            </figure>
        </section>
        <section class="bay bay--hero">
            <figure class="hanging hanging--hero hanging--square">
                <img src="art/hangings/06-yantra-cassetta.png" alt="The Yantra" decoding="async">
            </figure>
        </section>
        <section class="bay bay--hero">
            <figure class="hanging hanging--hero hanging--ivory">
                <img src="art/hangings/08-visage-ivory.png" alt="The Visage" decoding="async">
            </figure>
            <div id="realm-title">
                <h1>Gallery</h1>
            </div>
        </section>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;
        const STAR_COUNT = 2200;
        const TUNNEL_DEPTH = 900;
        const ENTER_MS = 2200;
        const EXIT_MS = 1200;

        const FRAMES = {
            walnut: {
                src: 'art/frames/walnut.png',
                inset: { top: '21.7%', right: '25.8%', bottom: '22.4%', left: '25.9%' }
            },
            gilt: {
                src: 'art/frames/gilt.png',
                inset: { top: '19.9%', right: '24.6%', bottom: '20.6%', left: '24.7%' }
            },
            iron: {
                src: 'art/frames/iron.png',
                inset: { top: '15.5%', right: '19.6%', bottom: '16.3%', left: '19.6%' }
            },
            titanium: {
                src: 'art/frames/titanium.png',
                inset: { top: '12.4%', right: '14.8%', bottom: '12.8%', left: '14.9%' }
            },
            walnutCarved: {
                src: 'art/frames/walnut-carved.png',
                inset: { top: '19.3%', right: '23.8%', bottom: '21.5%', left: '24.3%' }
            },
            bronze: {
                src: 'art/frames/bronze.png',
                inset: { top: '16.2%', right: '20.4%', bottom: '16.8%', left: '20.4%' }
            },
            brutalist: {
                src: 'art/frames/brutalist.png',
                inset: { top: '18.9%', right: '21.4%', bottom: '25.2%', left: '21.4%' }
            },
            rococo: {
                src: 'art/frames/rococo.png',
                inset: { top: '21.6%', right: '19.9%', bottom: '17.3%', left: '20.2%' }
            },
            ebonized: {
                src: 'art/frames/ebonized.png',
                inset: { top: '18.7%', right: '21.5%', bottom: '20.6%', left: '21.8%' }
            },
            cassetta: {
                src: 'art/frames/cassetta.png',
                inset: { top: '21.8%', right: '21.9%', bottom: '22.8%', left: '22.6%' }
            },
            ebony: {
                src: 'art/frames/ebony.png',
                inset: { top: '17.3%', right: '20.8%', bottom: '18.9%', left: '21.3%' }
            },
            ivory: {
                src: 'art/frames/ivory.png',
                inset: { top: '20.2%', right: '20.4%', bottom: '21.1%', left: '20.9%' }
            },
            photo: {
                src: 'art/frames/photo.png',
                inset: { top: '10.1%', right: '12.6%', bottom: '10.9%', left: '12.7%' }
            },
            fractalIvory: {
                src: 'art/frames/fractal-ivory.png',
                inset: { top: '28.2%', right: '23.9%', bottom: '19.7%', left: '23.9%' }
            }
        };

        const ARTWORKS = [
            {
                src: 'art/hangings/01-elder-gilt.png',
                alt: 'The Elder',
                frame: 'gilt'
            },
            {
                src: 'art/hangings/02-nautilus-walnut.png',
                alt: 'The Nautilus',
                frame: 'walnutCarved'
            },
            {
                src: 'art/hangings/03-altar-bronze.png',
                alt: 'The Altar',
                frame: 'bronze'
            },
            {
                src: 'art/hangings/04-throne-dark.png',
                alt: 'The Throne',
                frame: 'ebonized'
            },
            {
                src: 'art/hangings/06-yantra-cassetta.png',
                alt: 'The Yantra',
                frame: 'cassetta'
            },
            {
                src: 'art/hangings/08-visage-ivory.png',
                alt: 'The Visage',
                frame: 'fractalIvory'
            }
        ];

        const hall = document.getElementById('hall');
        if (!hall.querySelector('.hanging')) {
            ARTWORKS.forEach((spec) => {
                const frame = FRAMES[spec.frame] || FRAMES.walnut;
                const figure = document.createElement('figure');
                figure.className = 'hanging';
                const img = document.createElement('img');
                img.src = spec.src;
                img.alt = spec.alt || '';
                img.decoding = 'async';
                figure.appendChild(img);
                hall.appendChild(figure);
            });
        }
        const hangings = Array.from(hall.querySelectorAll('.hanging'));

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function readFocusQuery() {
            const focusQuery = Number(new URLSearchParams(window.location.search).get('focus'));
            if (!Number.isInteger(focusQuery) || !hangings.length) return 0;
            return Math.max(0, Math.min(hangings.length - 1, focusQuery));
        }
        let focusIndex = readFocusQuery();
        function applyHallLayout() {
            hangings.forEach((el, i) => {
                if (isMobile()) {
                    el.classList.toggle('is-off', i !== focusIndex);
                } else {
                    el.classList.remove('is-off');
                }
            });
        }
        applyHallLayout();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0009);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0);
        camera.fov = 92;
        camera.updateProjectionMatrix();

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        const warm = new THREE.Color(0xe8d2a0);
        const ice = new THREE.Color(0xf4f1ea);
        const dim = new THREE.Color(0x8a8fa3);

        const linePositions = new Float32Array(STAR_COUNT * 6);
        const lineColors = new Float32Array(STAR_COUNT * 6);
        const starXY = new Float32Array(STAR_COUNT * 2);
        const starZ = new Float32Array(STAR_COUNT);
        const starRGB = new Float32Array(STAR_COUNT * 3);

        function paintStarColor(i) {
            const pick = Math.random();
            let color = ice;
            if (pick > 0.42 && pick <= 0.74) color = dim;
            else if (pick > 0.74) color = warm;
            starRGB[i * 3] = color.r;
            starRGB[i * 3 + 1] = color.g;
            starRGB[i * 3 + 2] = color.b;
        }

        function placeStar(i, z) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 78;
            starXY[i * 2] = Math.cos(angle) * radius;
            starXY[i * 2 + 1] = Math.sin(angle) * radius;
            starZ[i] = z;
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            paintStarColor(i);
            const r = starRGB[i * 3];
            const g = starRGB[i * 3 + 1];
            const b = starRGB[i * 3 + 2];
            lineColors[i * 6] = r;
            lineColors[i * 6 + 1] = g;
            lineColors[i * 6 + 2] = b;
            lineColors[i * 6 + 3] = r * 0.25;
            lineColors[i * 6 + 4] = g * 0.25;
            lineColors[i * 6 + 5] = b * 0.25;
        }

        const streakGeom = new THREE.BufferGeometry();
        streakGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        streakGeom.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        const streakMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const streakMesh = new THREE.LineSegments(streakGeom, streakMat);
        streakMesh.frustumCulled = false;
        scene.add(streakMesh);

        const pointPositions = new Float32Array(STAR_COUNT * 3);
        const pointColors = new Float32Array(STAR_COUNT * 3);
        const pointsGeom = new THREE.BufferGeometry();
        pointsGeom.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointsGeom.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const pointsMat = new THREE.PointsMaterial({
            vertexColors: true,
            size: 0.55,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const pointMesh = new THREE.Points(pointsGeom, pointsMat);
        pointMesh.visible = false;
        pointMesh.frustumCulled = false;
        scene.add(pointMesh);

        const header = document.querySelector('header');
        const titleEl = document.getElementById('realm-title');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        titleEl.style.opacity = '0';
        header.style.pointerEvents = 'none';

        let mode = 'enter';
        let phaseStart = 0;
        let exiting = false;
        const baseFov = 70;

        function writeStreaks(stretch, rush, dt) {
            const arr = streakGeom.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 12) {
                    placeStar(i, -TUNNEL_DEPTH - Math.random() * 80);
                    z = starZ[i];
                }
                starZ[i] = z;
                const x = starXY[i * 2];
                const y = starXY[i * 2 + 1];
                arr[i * 6] = x;
                arr[i * 6 + 1] = y;
                arr[i * 6 + 2] = z;
                arr[i * 6 + 3] = x;
                arr[i * 6 + 4] = y;
                arr[i * 6 + 5] = z - stretch;
            }
            streakGeom.attributes.position.needsUpdate = true;
        }

        function settlePoints() {
            for (let i = 0; i < STAR_COUNT; i++) {
                pointPositions[i * 3] = starXY[i * 2];
                pointPositions[i * 3 + 1] = starXY[i * 2 + 1];
                pointPositions[i * 3 + 2] = starZ[i];
                pointColors[i * 3] = starRGB[i * 3];
                pointColors[i * 3 + 1] = starRGB[i * 3 + 1];
                pointColors[i * 3 + 2] = starRGB[i * 3 + 2];
            }
            pointsGeom.attributes.position.needsUpdate = true;
            pointsGeom.attributes.color.needsUpdate = true;
            pointMesh.visible = true;
        }

        function driftPoints(dt, rush) {
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 8) {
                    placeStar(i, -TUNNEL_DEPTH - Math.random() * 80);
                    z = starZ[i];
                }
                starZ[i] = z;
                pointPositions[i * 3] = starXY[i * 2];
                pointPositions[i * 3 + 1] = starXY[i * 2 + 1];
                pointPositions[i * 3 + 2] = z;
            }
            pointsGeom.attributes.position.needsUpdate = true;
        }

        function setFocus(next) {
            if (!hangings.length) return;
            focusIndex = Math.max(0, Math.min(hangings.length - 1, next));
            applyHallLayout();
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            header.style.pointerEvents = 'none';
            hall.style.opacity = '1';
            mode = 'exit';
            phaseStart = 0;
            pointMesh.visible = false;
            streakMesh.visible = true;
            for (let i = 0; i < STAR_COUNT; i++) {
                if (starZ[i] > -20) placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            }
        }

        header.style.cursor = 'pointer';
        header.addEventListener('click', exitAnimation);

        let touchX = null;
        window.addEventListener('touchstart', (event) => {
            if (event.target.closest && event.target.closest('header')) return;
            if (event.touches.length === 1) touchX = event.touches[0].clientX;
        }, { passive: true });
        window.addEventListener('touchend', (event) => {
            if (touchX == null || mode !== 'idle') {
                touchX = null;
                return;
            }
            const endX = event.changedTouches[0] ? event.changedTouches[0].clientX : touchX;
            const dx = endX - touchX;
            touchX = null;
            if (Math.abs(dx) < 48 || hangings.length < 2) return;
            setFocus(focusIndex + (dx < 0 ? 1 : -1));
        }, { passive: true });

        window.addEventListener('pageshow', () => {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            focusIndex = readFocusQuery();
            camera.position.set(0, 0, 0);
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            titleEl.style.opacity = '0';
            hall.style.opacity = '';
            hall.scrollTop = 0;
            camera.fov = 92;
            camera.updateProjectionMatrix();
            pointMesh.visible = false;
            streakMesh.visible = true;
            pointsMat.opacity = 0;
            streakMat.opacity = 1;
            if (flash) flash.style.opacity = '0.28';
            applyHallLayout();
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            if (!phaseStart) phaseStart = time;

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const warpLeft = 1 - easeOut;
                writeStreaks(8 + warpLeft * 95, 40 + warpLeft * 420, dt);

                camera.fov = 92 - easeOut * 22;
                camera.updateProjectionMatrix();
                scene.fog.density = 0.0009 + easeOut * 0.0016;

                if (flash) flash.style.opacity = String(Math.max(0, 0.28 * (1 - Math.min((time - phaseStart) / 350, 1))));

                if (progress >= 1) {
                    settlePoints();
                    streakMesh.visible = false;
                    pointsMat.opacity = 0.9;
                    header.style.transition = 'opacity 1.1s ease';
                    titleEl.style.transition = 'opacity 1.4s ease';
                    header.style.opacity = '1';
                    titleEl.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    if (flash) flash.style.opacity = '0';
                    mode = 'idle';
                }
            } else if (mode === 'idle') {
                driftPoints(dt, 0.42);
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress * progress;
                writeStreaks(8 + ease * 110, 60 + ease * 520, dt);
                streakMat.opacity = 0.55 + ease * 0.45;
                camera.fov = baseFov + ease * 48;
                camera.updateProjectionMatrix();
                titleEl.style.opacity = String(1 - ease);
                hall.style.opacity = String(1 - ease);
                if (flash) flash.style.opacity = String(Math.max(0, (progress - 0.4) / 0.6));
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            applyHallLayout();
        });
    </script>
</body>

</html>
