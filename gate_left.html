<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left Aperture</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);
        })();
    </script>
    <link rel="icon" type="image/jpeg" href="AiiAold.8dde82cb.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(18, 0, 4, 0.5);
            --glass-border: rgba(255, 45, 85, 0.4);
            --text-color: #ffd6de;
            --accent-color: #ff2d55;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #120006;
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(18, 0, 6, 0.78) 100%);
        }

        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header img {
            max-width: 110px;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(255, 45, 85, 0.5);
            transition: transform 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover { transform: scale(1.05); }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0.5;
            background: radial-gradient(circle at 70% 50%,
                rgba(255, 220, 230, 0.9) 0%,
                rgba(255, 45, 85, 0.7) 32%,
                rgba(18, 0, 6, 1) 100%);
        }

        #realm-title {
            position: fixed;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        #realm-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.3rem, 4.5vw, 2.8rem);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #ff2d55;
            text-shadow: 0 0 22px rgba(255, 45, 85, 0.55);
        }

        html.ui-ready header,
        html.ui-ready #realm-title { opacity: 1 !important; }
        html.ui-ready #warp-flash { opacity: 0 !important; }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>
    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="110" height="110" fetchpriority="high" decoding="async">
    </header>
    <div id="realm-title">
        <h1>Left Aperture</h1>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;
        const FRAME_MS = 1000 / 60;
        const STAR_COUNT = 2000;
        const DEPTH = 700;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120006);
        scene.fog = new THREE.FogExp2(0x120006, 0.002);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0);
        camera.fov = 88;
        camera.updateProjectionMatrix();

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x120006, 1);
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) { renderer.setAnimationLoop(fn); return; }
            function tick(t) { fn(t); rafId = requestAnimationFrame(tick); }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) { renderer.setAnimationLoop(null); return; }
            cancelAnimationFrame(rafId);
        }

        const crimson = new THREE.Color(0xff2d55);
        const ember = new THREE.Color(0xff6b4a);
        const linePositions = new Float32Array(STAR_COUNT * 6);
        const lineColors = new Float32Array(STAR_COUNT * 6);
        const starPos = new Float32Array(STAR_COUNT * 3);
        const starRGB = new Float32Array(STAR_COUNT * 3);

        function paintStar(i) {
            const c = Math.random() > 0.45 ? crimson : (Math.random() > 0.5 ? ember : new THREE.Color(0xffffff));
            starRGB[i * 3] = c.r; starRGB[i * 3 + 1] = c.g; starRGB[i * 3 + 2] = c.b;
        }

        function placeStarFromRight(i) {
            starPos[i * 3] = 40 + Math.random() * DEPTH;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 90;
            starPos[i * 3 + 2] = -20 - Math.random() * 220;
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            placeStarFromRight(i);
            paintStar(i);
            const r = starRGB[i * 3], g = starRGB[i * 3 + 1], b = starRGB[i * 3 + 2];
            lineColors[i * 6] = r; lineColors[i * 6 + 1] = g; lineColors[i * 6 + 2] = b;
            lineColors[i * 6 + 3] = r * 0.2; lineColors[i * 6 + 4] = g * 0.2; lineColors[i * 6 + 5] = b * 0.2;
        }

        const streakGeom = new THREE.BufferGeometry();
        streakGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        streakGeom.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        const streakMat = new THREE.LineBasicMaterial({
            vertexColors: true, transparent: true, opacity: 1,
            blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        });
        const streakMesh = new THREE.LineSegments(streakGeom, streakMat);
        streakMesh.frustumCulled = false;
        scene.add(streakMesh);

        const pointPositions = new Float32Array(STAR_COUNT * 3);
        const pointColors = new Float32Array(STAR_COUNT * 3);
        const pointsGeom = new THREE.BufferGeometry();
        pointsGeom.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointsGeom.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const pointsMat = new THREE.PointsMaterial({
            vertexColors: true, size: 0.5, transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        });
        const pointMesh = new THREE.Points(pointsGeom, pointsMat);
        pointMesh.visible = false;
        pointMesh.frustumCulled = false;
        scene.add(pointMesh);

        const gate = new THREE.Group();
        gate.position.set(0, 0, -34);
        gate.scale.set(0.001, 0.001, 0.001);
        scene.add(gate);

        const pillarMat = new THREE.MeshBasicMaterial({
            color: 0x3a0010, transparent: true, opacity: 0.9, fog: false
        });
        const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 38, 1.2), pillarMat);
        leftPillar.position.x = -4.2;
        const rightPillar = leftPillar.clone();
        rightPillar.position.x = 4.2;
        const slit = new THREE.Mesh(
            new THREE.PlaneGeometry(1.4, 32),
            new THREE.MeshBasicMaterial({
                color: 0xff2d55, transparent: true, opacity: 0.55,
                side: THREE.DoubleSide, fog: false
            })
        );
        gate.add(leftPillar, rightPillar, slit);
        gate.add(new THREE.PointLight(0xff2d55, 1.8, 70));

        const header = document.querySelector('header');
        const titleEl = document.getElementById('realm-title');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        titleEl.style.opacity = '0';
        header.style.pointerEvents = 'none';

        let mode = 'enter';
        let phaseStart = 0;
        let exiting = false;
        const ENTER_MS = 2000;
        const EXIT_MS = 1100;

        function writeStreaks(stretch, rushX, dt) {
            const arr = streakGeom.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                let x = starPos[i * 3] + rushX * dt;
                if (x < -30) {
                    placeStarFromRight(i);
                    x = starPos[i * 3];
                }
                starPos[i * 3] = x;
                const y = starPos[i * 3 + 1];
                const z = starPos[i * 3 + 2];
                arr[i * 6] = x;
                arr[i * 6 + 1] = y;
                arr[i * 6 + 2] = z;
                arr[i * 6 + 3] = x + stretch;
                arr[i * 6 + 4] = y;
                arr[i * 6 + 5] = z;
            }
            streakGeom.attributes.position.needsUpdate = true;
        }

        function settlePoints() {
            for (let i = 0; i < STAR_COUNT; i++) {
                pointPositions[i * 3] = starPos[i * 3];
                pointPositions[i * 3 + 1] = starPos[i * 3 + 1];
                pointPositions[i * 3 + 2] = starPos[i * 3 + 2];
                pointColors[i * 3] = starRGB[i * 3];
                pointColors[i * 3 + 1] = starRGB[i * 3 + 1];
                pointColors[i * 3 + 2] = starRGB[i * 3 + 2];
            }
            pointsGeom.attributes.position.needsUpdate = true;
            pointsGeom.attributes.color.needsUpdate = true;
            pointMesh.visible = true;
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            header.style.pointerEvents = 'none';
            mode = 'exit';
            phaseStart = 0;
            pointMesh.visible = false;
            streakMesh.visible = true;
        }

        header.style.cursor = 'pointer';
        header.addEventListener('click', exitAnimation);

        window.addEventListener('pageshow', () => {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            titleEl.style.opacity = '0';
            if (flash) flash.style.opacity = '0.5';
            camera.fov = 88;
            camera.updateProjectionMatrix();
            gate.scale.set(0.001, 0.001, 0.001);
            pointMesh.visible = false;
            streakMesh.visible = true;
            pointsMat.opacity = 0;
            streakMat.opacity = 1;
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;
            if (!phaseStart) phaseStart = time;

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const warpLeft = 1 - easeOut;
                writeStreaks(10 + warpLeft * 90, -(80 + warpLeft * 380), dt);
                camera.fov = 88 - easeOut * 16;
                camera.updateProjectionMatrix();
                if (flash) flash.style.opacity = String(Math.max(0, 0.5 * (1 - Math.min((time - phaseStart) / 400, 1))));
                const gateT = Math.max(0, (progress - 0.4) / 0.6);
                gate.scale.setScalar(Math.max(0.001, 1 - Math.pow(1 - gateT, 3)));
                if (progress >= 1) {
                    settlePoints();
                    streakMesh.visible = false;
                    pointsMat.opacity = 0.9;
                    header.style.transition = 'opacity 1.1s ease';
                    titleEl.style.transition = 'opacity 1.4s ease';
                    header.style.opacity = '1';
                    titleEl.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    mode = 'idle';
                }
            } else if (mode === 'idle') {
                pointMesh.rotation.y += 0.00012 * dt;
                gate.rotation.y += 0.001 * dt;
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress * progress;
                writeStreaks(12 + ease * 110, 70 + ease * 420, dt);
                streakMat.opacity = 0.55 + ease * 0.45;
                camera.fov = 72 + ease * 40;
                camera.updateProjectionMatrix();
                gate.scale.setScalar(Math.max(0.001, 1 - ease));
                header.style.opacity = String(1 - ease);
                titleEl.style.opacity = String(1 - ease);
                if (flash) flash.style.opacity = String(Math.max(0, (progress - 0.35) / 0.65));
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            slit.material.opacity = 0.4 + Math.sin(time * 0.003) * 0.18;
            renderer.render(scene, camera);
        }

        startLoop(animate);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { stopLoop(); lastFrameTime = 0; }
            else startLoop(animate);
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
