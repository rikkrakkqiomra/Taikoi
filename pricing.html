    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);

    <style>
        /* # Design System Variables */
        :root {
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --accent-color: #00f3ff;
        }

        /* # Global Reset & Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            /* # Prevent scrollbars */
            background-color: #000;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-color);
        }

        /* # 3D Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* # Behind UI */
        }

        /* # Glassmorphism Utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* # Header & Navigation */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            /* # Remove outline on click */
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header:focus,
        header:active {
            outline: none;
        }

        /* # Logo Styling & Interaction */
        header img {
            max-width: 150px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
            /* # Prevent blue/gray flash on click */
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover {
            transform: scale(1.05);
        }

        header img:focus,
        header img:active {
            outline: none;
        }

        /* # Floating Content Layout */
        .floating-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
            overflow-y: auto;
            /* # Enable scrolling */
            padding-top: 260px;
            /* # Space for header */
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            perspective: 1000px;
        }

        /* # Content Block Styling */
        .floating-block {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            color: #ddd;
            text-align: left;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);

            /* Floating Animation */
            animation: float 6s ease-in-out infinite;
            opacity: 0;
            /* Start hidden for entry animation */
            transform: translateY(50px);
        }

        .floating-block h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
        }

        .floating-block p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .floating-block ul {
            list-style: none;
            padding-left: 10px;
        }

        .floating-block li {
            margin-bottom: 15px;
            position: relative;
            padding-left: 25px;
        }

        .floating-block li::before {
            content: '>';
            position: absolute;
            left: 0;
            color: var(--accent-color);
            font-weight: bold;
        }

        .floating-block strong {
            color: #fff;
        }

        .quote {
            font-style: italic;
            color: #fff;
            border-left: 4px solid var(--accent-color);
            padding-left: 20px;
            margin: 30px 0;
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.1) 0%, rgba(0, 0, 0, 0) 100%);
            padding: 20px;
            font-size: 1.2rem;
        }

        /* # Animation Delays for Staggered Entry */
        .delay-1 {
            animation-delay: 0s;
        }

        .delay-2 {
            animation-delay: 0.5s;
        }

        .delay-3 {
            animation-delay: 1s;
        }

        .delay-4 {
            animation-delay: 1.5s;
        }

        .delay-5 {
            animation-delay: 2s;
        }

        /* # Keyframe Animations */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* # Custom Scrollbar Styling */
        .floating-container::-webkit-scrollbar {
            width: 8px;
        }

        .floating-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .floating-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        .floating-container::-webkit-scrollbar-thumb:hover {
            background: #fff;
        }

        html.ui-ready header,
        html.ui-ready .floating-container,
        html.ui-ready .floating-block {
            opacity: 1 !important;
        }
    </style>
</head>

<body>

    <!-- # 3D Render Target -->
    <div id="canvas-container"></div>

    <!-- # Header with Logo -->
    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="150" height="150" fetchpriority="high" decoding="async">
    </header>

    <!-- # Main Content Container -->
    <div class="floating-container">
        <div class="floating-block delay-1">
            <h2>Pricing</h2>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;

        // # Scene Initialization
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 100);

        // # Renderer Setup
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        // # Starfield Generation (Procedural)
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 500;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({
            size: 0.2,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8,
        });
        const starMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starMesh);

        // # Entry Animation Logic
        // Initial State
        scene.scale.set(0.001, 0.001, 0.001);

        const header = document.querySelector('header');
        const floatingContainer = document.querySelector('.floating-container');
        const blocks = document.querySelectorAll('.floating-block');

        // # Hide UI initially
        header.style.opacity = '0';
        floatingContainer.style.opacity = '0';
        header.style.transition = 'opacity 2s ease';
        floatingContainer.style.transition = 'opacity 2s ease';

        // # Animation Loop for Entry
        const startTime = Date.now();
        const duration = 1500; // 1.5 seconds

        function entryLoop() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Easing: Cubic Out (starts fast, ends slow)
            const ease = 1 - Math.pow(1 - progress, 3);

            scene.scale.set(ease, ease, ease);
            // Spin out effect
            scene.rotation.z = (1 - ease) * 1.0;

            if (progress < 1) {
                requestAnimationFrame(entryLoop);
            } else {
                // Ensure final state
                scene.scale.set(1, 1, 1);
                scene.rotation.z = 0;

                // Show UI
                header.style.opacity = '1';
                floatingContainer.style.opacity = '1';

                // Trigger block animations manually to ensure they start after entry
                blocks.forEach((block, index) => {
                    // We use a combination of float (infinite) and fadeIn (once)
                    // But since we set opacity:0 in CSS, we need to make sure they fade in
                    block.style.animation = `float 6s ease-in-out infinite ${index * 0.5}s, fadeIn 1s ease forwards ${index * 0.3}s`;
                });
            }
        }

        // Start entry animation
        entryLoop();

        // # Exit Animation Logic
        function exitAnimation() {
            // Prevent double clicks
            header.style.pointerEvents = 'none';

            const startTime = Date.now();
            const duration = 1000; // 1 second

            function exitLoop() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing: Cubic In (starts slow, ends fast)
                const ease = progress * progress * progress;

                // Scale down 1 -> 0
                const scale = 1 - ease;
                scene.scale.set(scale, scale, scale);

                // Spin effect (reverse of entry)
                scene.rotation.z = ease * 1.0;

                // Fade out UI
                header.style.opacity = 1 - ease;
                floatingContainer.style.opacity = 1 - ease;

                if (progress < 1) {
                    requestAnimationFrame(exitLoop);
                } else {
                    // Navigate back
                    window.location.href = 'services.html';
                }
            }
            exitLoop();
        }

        // # Event Listeners
        // Make header clickable for exit
        window.__aivoinkoSealExit = exitAnimation;

        // # Main Animation Loop
        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            // Rotate stars slowly
            starMesh.rotation.y += 0.0005 * dt;

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        // # Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
