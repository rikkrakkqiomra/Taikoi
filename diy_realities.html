<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Realities</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);
        })();
    </script>
    <link rel="icon" type="image/jpeg" href="AiiAold.8dde82cb.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(12, 0, 22, 0.45);
            --glass-border: rgba(224, 64, 251, 0.35);
            --text-color: #f4e8ff;
            --accent-color: #e040fb;
            --amber: #ffab40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #07010e;
            font-family: 'Exo 2', sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 42%, rgba(7, 1, 14, 0.72) 100%);
        }

        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header img {
            max-width: 120px;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(224, 64, 251, 0.45), 0 0 48px rgba(255, 171, 64, 0.18);
            transition: transform 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover {
            transform: scale(1.05);
        }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 1;
            background: radial-gradient(circle at center,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(224, 64, 251, 0.8) 28%,
                rgba(255, 171, 64, 0.35) 58%,
                rgba(7, 1, 14, 1) 100%);
        }

        #realm-title {
            position: fixed;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        #realm-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.6rem, 5vw, 3.4rem);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffab40, #e040fb, #7c4dff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(224, 64, 251, 0.35));
        }

        html.ui-ready header,
        html.ui-ready #realm-title {
            opacity: 1 !important;
        }

        html.ui-ready #warp-flash {
            opacity: 0 !important;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>

    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="120" height="120" fetchpriority="high" decoding="async">
    </header>

    <div id="realm-title">
        <h1>DIY Realities</h1>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;
        const STAR_COUNT = 2200;
        const TUNNEL_DEPTH = 900;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07010e);
        scene.fog = new THREE.FogExp2(0x07010e, 0.0018);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0);
        camera.fov = 92;
        camera.updateProjectionMatrix();

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x07010e, 1);
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        const magenta = new THREE.Color(0xe040fb);
        const amber = new THREE.Color(0xffab40);
        const violet = new THREE.Color(0x7c4dff);

        const linePositions = new Float32Array(STAR_COUNT * 6);
        const lineColors = new Float32Array(STAR_COUNT * 6);
        const starXY = new Float32Array(STAR_COUNT * 2);
        const starZ = new Float32Array(STAR_COUNT);
        const starRGB = new Float32Array(STAR_COUNT * 3);

        function paintStarColor(i) {
            const pick = Math.random();
            let color = new THREE.Color(0xffffff);
            if (pick > 0.42 && pick <= 0.74) color = magenta;
            else if (pick > 0.74) color = amber;
            starRGB[i * 3] = color.r;
            starRGB[i * 3 + 1] = color.g;
            starRGB[i * 3 + 2] = color.b;
        }

        function placeStar(i, z) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 78;
            starXY[i * 2] = Math.cos(angle) * radius;
            starXY[i * 2 + 1] = Math.sin(angle) * radius;
            starZ[i] = z;
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            paintStarColor(i);
            const r = starRGB[i * 3];
            const g = starRGB[i * 3 + 1];
            const b = starRGB[i * 3 + 2];
            lineColors[i * 6] = r;
            lineColors[i * 6 + 1] = g;
            lineColors[i * 6 + 2] = b;
            lineColors[i * 6 + 3] = r * 0.25;
            lineColors[i * 6 + 4] = g * 0.25;
            lineColors[i * 6 + 5] = b * 0.25;
        }

        const streakGeom = new THREE.BufferGeometry();
        streakGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        streakGeom.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        const streakMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const streakMesh = new THREE.LineSegments(streakGeom, streakMat);
        streakMesh.frustumCulled = false;
        scene.add(streakMesh);

        const pointPositions = new Float32Array(STAR_COUNT * 3);
        const pointColors = new Float32Array(STAR_COUNT * 3);
        const pointsGeom = new THREE.BufferGeometry();
        pointsGeom.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointsGeom.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const pointsMat = new THREE.PointsMaterial({
            vertexColors: true,
            size: 0.55,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const pointMesh = new THREE.Points(pointsGeom, pointsMat);
        pointMesh.visible = false;
        pointMesh.frustumCulled = false;
        scene.add(pointMesh);

        const loom = new THREE.Group();
        loom.position.set(0, 0, -38);
        loom.scale.set(0.001, 0.001, 0.001);
        scene.add(loom);

        function makeRing(radius, color) {
            const geo = new THREE.TorusGeometry(radius, 0.08, 8, 96);
            const mat = new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity: 0.78,
                wireframe: true,
                fog: false
            });
            return new THREE.Mesh(geo, mat);
        }

        const ringA = makeRing(7.2, magenta);
        const ringB = makeRing(9.4, amber);
        ringB.rotation.x = Math.PI / 2;
        const ringC = makeRing(11.6, violet);
        ringC.rotation.y = Math.PI / 2;
        loom.add(ringA, ringB, ringC);

        const core = new THREE.Mesh(
            new THREE.IcosahedronGeometry(2.4, 1),
            new THREE.MeshBasicMaterial({
                color: 0xffab40,
                wireframe: true,
                transparent: true,
                opacity: 0.85,
                fog: false
            })
        );
        loom.add(core);

        const coreGlow = new THREE.PointLight(0xe040fb, 1.6, 80);
        loom.add(coreGlow);
        const amberLight = new THREE.PointLight(0xffab40, 0.9, 70);
        amberLight.position.set(8, -4, 6);
        loom.add(amberLight);

        const header = document.querySelector('header');
        const titleEl = document.getElementById('realm-title');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        titleEl.style.opacity = '0';
        header.style.pointerEvents = 'none';

        let mode = 'enter';
        let phaseStart = 0;
        let exiting = false;
        const ENTER_MS = 2200;
        const EXIT_MS = 1200;
        const baseFov = 70;

        function writeStreaks(stretch, rush, dt) {
            const arr = streakGeom.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 12) {
                    placeStar(i, -TUNNEL_DEPTH - Math.random() * 80);
                    z = starZ[i];
                }
                starZ[i] = z;
                const x = starXY[i * 2];
                const y = starXY[i * 2 + 1];
                arr[i * 6] = x;
                arr[i * 6 + 1] = y;
                arr[i * 6 + 2] = z;
                arr[i * 6 + 3] = x;
                arr[i * 6 + 4] = y;
                arr[i * 6 + 5] = z - stretch;
            }
            streakGeom.attributes.position.needsUpdate = true;
        }

        function settlePoints() {
            for (let i = 0; i < STAR_COUNT; i++) {
                const x = starXY[i * 2];
                const y = starXY[i * 2 + 1];
                const z = starZ[i];
                pointPositions[i * 3] = x;
                pointPositions[i * 3 + 1] = y;
                pointPositions[i * 3 + 2] = z;
                pointColors[i * 3] = starRGB[i * 3];
                pointColors[i * 3 + 1] = starRGB[i * 3 + 1];
                pointColors[i * 3 + 2] = starRGB[i * 3 + 2];
            }
            pointsGeom.attributes.position.needsUpdate = true;
            pointsGeom.attributes.color.needsUpdate = true;
            pointMesh.visible = true;
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            header.style.pointerEvents = 'none';
            mode = 'exit';
            phaseStart = 0;
            pointMesh.visible = false;
            streakMesh.visible = true;
            for (let i = 0; i < STAR_COUNT; i++) {
                if (starZ[i] > -20) placeStar(i, -(Math.random() * TUNNEL_DEPTH + 20));
            }
        }

        header.style.cursor = 'pointer';
        header.addEventListener('click', exitAnimation);

        window.addEventListener('pageshow', () => {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            titleEl.style.opacity = '0';
            if (flash) flash.style.opacity = '1';
            camera.fov = 92;
            camera.updateProjectionMatrix();
            loom.scale.set(0.001, 0.001, 0.001);
            pointMesh.visible = false;
            streakMesh.visible = true;
            pointsMat.opacity = 0;
            streakMat.opacity = 1;
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            if (!phaseStart) phaseStart = time;

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const warpLeft = 1 - easeOut;
                const stretch = 8 + warpLeft * 95;
                const rush = 40 + warpLeft * 420;
                writeStreaks(stretch, rush, dt);

                camera.fov = 92 - easeOut * 22;
                camera.updateProjectionMatrix();
                scene.fog.density = 0.0009 + easeOut * 0.0016;

                if (flash) flash.style.opacity = String(Math.max(0, 1 - progress / 0.45));

                const loomT = Math.max(0, (progress - 0.45) / 0.55);
                const loomEase = 1 - Math.pow(1 - loomT, 3);
                loom.scale.setScalar(Math.max(0.001, loomEase));

                if (progress >= 1) {
                    settlePoints();
                    streakMesh.visible = false;
                    pointsMat.opacity = 0.9;
                    header.style.transition = 'opacity 1.1s ease';
                    titleEl.style.transition = 'opacity 1.4s ease';
                    header.style.opacity = '1';
                    titleEl.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    mode = 'idle';
                }
            } else if (mode === 'idle') {
                pointMesh.rotation.y += 0.00018 * dt;
                pointMesh.rotation.x += 0.00005 * dt;
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress * progress;
                const stretch = 8 + ease * 110;
                const rush = 60 + ease * 520;
                writeStreaks(stretch, rush, dt);
                streakMat.opacity = 0.55 + ease * 0.45;
                camera.fov = baseFov + ease * 48;
                camera.updateProjectionMatrix();
                loom.scale.setScalar(Math.max(0.001, 1 - ease));
                header.style.opacity = String(1 - ease);
                titleEl.style.opacity = String(1 - ease);
                if (flash) flash.style.opacity = String(Math.max(0, (progress - 0.4) / 0.6));
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            ringA.rotation.z += 0.01 * dt;
            ringB.rotation.x += 0.007 * dt;
            ringC.rotation.y += 0.012 * dt;
            loom.rotation.y += 0.0024 * dt;
            const pulse = 1 + Math.sin(time * 0.0024) * 0.08;
            core.scale.setScalar(pulse);

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
