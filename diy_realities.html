<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khaeos</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script>
        (function () {
            function revealUi() {
                if (window.__aivoinko3d) return;
                document.documentElement.classList.add('ui-ready');
            }
            window.__aivoinkoReveal = revealUi;
            window.addEventListener('error', function () { revealUi(); }, true);
            window.addEventListener('unhandledrejection', function () { revealUi(); });
            setTimeout(revealUi, 2500);
        })();
    </script>
    <link rel="icon" type="image/jpeg" href="AiiAold.8dde82cb.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seal-menu.css">
    <script src="seal-menu.js" defer></script>
    <style>
        :root {
            --glass-bg: rgba(18, 12, 6, 0.5);
            --glass-border: rgba(217, 164, 65, 0.35);
            --text-color: #e9dcc0;
            --accent-color: #d9a441;
            --green: #2f6d3a;
            --parchment: #e9dcc0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #070604;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 36%, rgba(7, 6, 4, 0.78) 100%);
        }

        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        header img {
            max-width: 120px;
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(217, 164, 65, 0.4), 0 0 48px rgba(47, 109, 58, 0.28);
            transition: transform 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header img:hover {
            transform: scale(1.05);
        }

        #warp-flash {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0.5;
            background: radial-gradient(circle at center,
                rgba(255, 248, 230, 0.95) 0%,
                rgba(217, 164, 65, 0.72) 26%,
                rgba(47, 109, 58, 0.32) 56%,
                rgba(7, 6, 4, 1) 100%);
        }

        #realm-title {
            position: fixed;
            left: 50%;
            bottom: 3.2vh;
            transform: translateX(-50%);
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
        }

        #realm-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.68rem, 1.5vw, 0.95rem);
            letter-spacing: 0.72em;
            text-indent: 0.72em;
            text-transform: uppercase;
            color: #d9a441;
            text-shadow: 0 0 18px rgba(217, 164, 65, 0.45);
        }

        html.ui-ready header,
        html.ui-ready #realm-title {
            opacity: 1 !important;
        }

        html.ui-ready #warp-flash {
            opacity: 0 !important;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="warp-flash" aria-hidden="true"></div>

    <header>
        <img src="AiiAold.8dde82cb.jpg" alt="Aivoinko Logo" width="120" height="120" fetchpriority="high" decoding="async">
    </header>

    <div id="realm-title">
        <h1>KhaeoΣ</h1>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.__aivoinko3d = true;

        const FRAME_MS = 1000 / 60;
        const STAR_COUNT = 1700;
        const TUNNEL_DEPTH = 900;
        const BAND_NEAR = -7.5;
        const BAND_FAR = -56;
        const BASE_FOV = 70;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070604);
        scene.fog = new THREE.FogExp2(0x070604, 0.012);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0);
        camera.fov = 92;
        camera.updateProjectionMatrix();

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x070604, 1);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);
        } catch (err) {
            console.warn('WebGL unavailable', err);
            window.__aivoinko3d = false;
            if (typeof window.__aivoinkoReveal === 'function') window.__aivoinkoReveal();
            throw err;
        }

        let rafId = 0;
        function startLoop(fn) {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(fn);
                return;
            }
            function tick(t) {
                fn(t);
                rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
            if (renderer.setAnimationLoop) {
                renderer.setAnimationLoop(null);
                return;
            }
            cancelAnimationFrame(rafId);
        }

        const gold = new THREE.Color(0xd9a441);
        const bone = new THREE.Color(0xf3ead4);
        const green = new THREE.Color(0x7dcea0);

        const loader = new THREE.TextureLoader();
        const texLogo = loader.load('art/khaeos/khaeos-logo.png', undefined, undefined, () => {
            console.warn('Khaeos logo failed');
        });
        texLogo.colorSpace = THREE.SRGBColorSpace;
        texLogo.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

        function makeGlowTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(128, 128, 8, 128, 128, 124);
            grd.addColorStop(0, 'rgba(217, 164, 65, 0.55)');
            grd.addColorStop(0.42, 'rgba(217, 164, 65, 0.12)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            g.fillStyle = grd;
            g.fillRect(0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        scene.add(new THREE.AmbientLight(0x3a2c18, 0.35));
        const keyLight = new THREE.PointLight(0xffe2a8, 18, 80, 2);
        keyLight.position.set(0, 2, -8);
        scene.add(keyLight);

        const temple = new THREE.Group();
        temple.scale.setScalar(0.001);
        scene.add(temple);

        const mark = new THREE.Group();
        const halo = new THREE.Group();
        temple.add(mark);
        mark.add(halo);

        const glow = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshBasicMaterial({
                map: makeGlowTexture(),
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            })
        );
        glow.renderOrder = 1;

        const logo = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshBasicMaterial({
                map: texLogo,
                transparent: true,
                alphaTest: 0.15,
                depthWrite: true,
                fog: false
            })
        );
        logo.renderOrder = 4;
        mark.add(glow, logo);

        const RING_SPECS = [
            { radius: 0.56, tube: 0.016, color: 0xd9a441, opacity: 0.92, speed: 0.0042, tiltX: 0.16, tiltY: 0.02, wobble: 0.06, freq: 0.00055 },
            { radius: 0.7, tube: 0.009, color: 0xf3ead4, opacity: 0.74, speed: -0.0031, tiltX: 0.48, tiltY: 0.18, wobble: 0.05, freq: 0.00042 },
            { radius: 0.84, tube: 0.013, color: 0x2f6d3a, opacity: 0.8, speed: 0.0036, tiltX: 0.28, tiltY: 0.55, wobble: 0.05, freq: 0.00048 },
            { radius: 0.98, tube: 0.008, color: 0xe8c56b, opacity: 0.68, speed: -0.0022, tiltX: 0.66, tiltY: 0.24, wobble: 0.04, freq: 0.00036 },
            { radius: 1.12, tube: 0.011, color: 0xb8893a, opacity: 0.6, speed: 0.0026, tiltX: 0.38, tiltY: 0.46, wobble: 0.045, freq: 0.0005 },
            { radius: 1.26, tube: 0.007, color: 0x6aab78, opacity: 0.55, speed: -0.0034, tiltX: 0.58, tiltY: 0.12, wobble: 0.04, freq: 0.00033 },
            { radius: 1.42, tube: 0.01, color: 0xfff1d2, opacity: 0.46, speed: 0.0016, tiltX: 0.22, tiltY: 0.7, wobble: 0.035, freq: 0.00028 }
        ];

        const rings = RING_SPECS.map((spec) => {
            const pivot = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.TorusGeometry(spec.radius, spec.tube, 28, 180),
                new THREE.MeshStandardMaterial({
                    color: spec.color,
                    emissive: spec.color,
                    emissiveIntensity: 0.32,
                    metalness: 0.82,
                    roughness: 0.16,
                    transparent: true,
                    opacity: spec.opacity,
                    depthWrite: true,
                    fog: false
                })
            );
            mesh.renderOrder = 3;
            mesh.userData = spec;
            pivot.rotation.x = spec.tiltX;
            pivot.rotation.y = spec.tiltY;
            pivot.add(mesh);
            halo.add(pivot);
            return mesh;
        });

        let logoBaseY = 0;

        function halfAt(dist) {
            const halfH = Math.tan((BASE_FOV * Math.PI) / 360) * dist;
            return { halfH, halfW: halfH * camera.aspect };
        }

        function layoutTemple() {
            const dist = 26;
            const view = halfAt(dist);
            const lW = Math.min(view.halfW * 1.28, view.halfH * 2.7);
            const lH = lW * (93 / 544);
            const ringScale = (lW * 0.5) / 0.52;
            logo.scale.set(lW, lH, 1);
            glow.scale.set(lW * 1.35, lW * 0.55, 1);
            glow.position.z = -0.4;
            rings.forEach((ring) => ring.scale.setScalar(ringScale));
            logoBaseY = -view.halfH * 0.02;
            mark.position.set(0, logoBaseY, -dist);
            keyLight.position.set(0, logoBaseY + 1.5, -dist + 10);
        }

        layoutTemple();

        const linePositions = new Float32Array(STAR_COUNT * 6);
        const lineColors = new Float32Array(STAR_COUNT * 6);
        const starXY = new Float32Array(STAR_COUNT * 2);
        const starZ = new Float32Array(STAR_COUNT);
        const starRGB = new Float32Array(STAR_COUNT * 3);

        function paintStarColor(i) {
            const pick = Math.random();
            let color = bone;
            if (pick > 0.72 && pick <= 0.9) color = gold;
            else if (pick > 0.9) color = green;
            starRGB[i * 3] = color.r;
            starRGB[i * 3 + 1] = color.g;
            starRGB[i * 3 + 2] = color.b;
        }

        function placeWarpStar(i) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 78;
            starXY[i * 2] = Math.cos(angle) * radius;
            starXY[i * 2 + 1] = Math.sin(angle) * radius;
            starZ[i] = -(Math.random() * TUNNEL_DEPTH + 20);
        }

        function placeTempleStar(i) {
            const z = BAND_FAR + Math.random() * (BAND_NEAR - BAND_FAR);
            const view = halfAt(-z);
            const span = Math.max(view.halfW, view.halfH) * 0.98;
            const ang = Math.random() * Math.PI * 2;
            const rad = Math.pow(Math.random(), 0.62) * span;
            starXY[i * 2] = Math.cos(ang) * rad;
            starXY[i * 2 + 1] = Math.sin(ang) * rad;
            starZ[i] = z;
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            placeWarpStar(i);
            paintStarColor(i);
            const r = starRGB[i * 3];
            const g = starRGB[i * 3 + 1];
            const b = starRGB[i * 3 + 2];
            lineColors[i * 6] = r;
            lineColors[i * 6 + 1] = g;
            lineColors[i * 6 + 2] = b;
            lineColors[i * 6 + 3] = r * 0.22;
            lineColors[i * 6 + 4] = g * 0.22;
            lineColors[i * 6 + 5] = b * 0.22;
        }

        const streakGeom = new THREE.BufferGeometry();
        streakGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        streakGeom.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
        const streakMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const streakMesh = new THREE.LineSegments(streakGeom, streakMat);
        streakMesh.frustumCulled = false;
        scene.add(streakMesh);

        const pointPositions = new Float32Array(STAR_COUNT * 3);
        const pointColors = new Float32Array(STAR_COUNT * 3);
        const pointsGeom = new THREE.BufferGeometry();
        pointsGeom.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointsGeom.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const pointsMat = new THREE.PointsMaterial({
            vertexColors: true,
            size: 0.045,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            fog: false
        });
        const pointMesh = new THREE.Points(pointsGeom, pointsMat);
        pointMesh.visible = false;
        pointMesh.frustumCulled = false;
        scene.add(pointMesh);

        const header = document.querySelector('header');
        const titleEl = document.getElementById('realm-title');
        const flash = document.getElementById('warp-flash');
        header.style.opacity = '0';
        titleEl.style.opacity = '0';
        header.style.pointerEvents = 'none';

        let mode = 'enter';
        let phaseStart = 0;
        let exiting = false;
        let starSpin = 0;
        const ENTER_MS = 2200;
        const EXIT_MS = 1200;
        const pointer = { x: 0, y: 0 };
        const camTarget = { x: 0, y: 0 };

        function onPointer(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
        }
        window.addEventListener('pointermove', onPointer, { passive: true });
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma == null) return;
            pointer.x = Math.max(-1, Math.min(1, e.gamma / 28));
            pointer.y = Math.max(-1, Math.min(1, ((e.beta || 0) - 35) / 32));
        });

        function writeStreaks(stretch, rush, dt) {
            const arr = streakGeom.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush * dt;
                if (z > 12) {
                    placeWarpStar(i);
                    z = starZ[i];
                }
                starZ[i] = z;
                const x = starXY[i * 2];
                const y = starXY[i * 2 + 1];
                arr[i * 6] = x;
                arr[i * 6 + 1] = y;
                arr[i * 6 + 2] = z;
                arr[i * 6 + 3] = x;
                arr[i * 6 + 4] = y;
                arr[i * 6 + 5] = z - stretch;
            }
            streakGeom.attributes.position.needsUpdate = true;
        }

        function writeTempleStars(dt) {
            starSpin += 0.00035 * dt;
            const c = Math.cos(starSpin);
            const s = Math.sin(starSpin);
            const rush = 0.085 * dt;
            for (let i = 0; i < STAR_COUNT; i++) {
                let z = starZ[i] + rush;
                if (z > BAND_NEAR) {
                    placeTempleStar(i);
                    z = starZ[i];
                }
                starZ[i] = z;
                const x0 = starXY[i * 2];
                const y0 = starXY[i * 2 + 1];
                pointPositions[i * 3] = x0 * c - y0 * s;
                pointPositions[i * 3 + 1] = x0 * s + y0 * c;
                pointPositions[i * 3 + 2] = z;
            }
            pointsGeom.attributes.position.needsUpdate = true;
        }

        function settlePoints() {
            for (let i = 0; i < STAR_COUNT; i++) {
                placeTempleStar(i);
                pointColors[i * 3] = starRGB[i * 3];
                pointColors[i * 3 + 1] = starRGB[i * 3 + 1];
                pointColors[i * 3 + 2] = starRGB[i * 3 + 2];
            }
            writeTempleStars(0);
            pointsGeom.attributes.color.needsUpdate = true;
            pointMesh.visible = true;
        }

        function exitAnimation() {
            if (exiting) return;
            exiting = true;
            header.style.pointerEvents = 'none';
            mode = 'exit';
            phaseStart = 0;
            pointMesh.visible = false;
            streakMesh.visible = true;
            for (let i = 0; i < STAR_COUNT; i++) placeWarpStar(i);
        }

        window.__aivoinkoSealExit = exitAnimation;

        window.addEventListener('pageshow', () => {
            exiting = false;
            mode = 'enter';
            phaseStart = 0;
            pointer.x = 0;
            pointer.y = 0;
            camera.position.set(0, 0, 0);
            header.style.pointerEvents = 'none';
            header.style.opacity = '0';
            titleEl.style.opacity = '0';
            if (flash) flash.style.opacity = '0.5';
            camera.fov = 92;
            camera.updateProjectionMatrix();
            temple.scale.setScalar(0.001);
            halo.rotation.set(0, 0, 0);
            pointMesh.visible = false;
            streakMesh.visible = true;
            pointsMat.opacity = 0;
            streakMat.opacity = 1;
            for (let i = 0; i < STAR_COUNT; i++) placeWarpStar(i);
        });

        let lastFrameTime = 0;
        function animate(time) {
            const deltaMs = lastFrameTime ? time - lastFrameTime : FRAME_MS;
            lastFrameTime = time;
            const dt = Math.min(deltaMs, 50) / FRAME_MS;

            if (!phaseStart) phaseStart = time;

            if (mode === 'enter') {
                const progress = Math.min((time - phaseStart) / ENTER_MS, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const warpLeft = 1 - easeOut;
                writeStreaks(8 + warpLeft * 95, 40 + warpLeft * 420, dt);

                camera.fov = 92 - easeOut * (92 - BASE_FOV);
                camera.updateProjectionMatrix();
                scene.fog.density = 0.004 + easeOut * 0.01;

                if (flash) flash.style.opacity = String(Math.max(0, 0.5 * (1 - Math.min((time - phaseStart) / 400, 1))));

                const loomT = Math.max(0, (progress - 0.45) / 0.55);
                const loomEase = 1 - Math.pow(1 - loomT, 3);
                temple.scale.setScalar(Math.max(0.001, loomEase));

                if (progress >= 1) {
                    settlePoints();
                    streakMesh.visible = false;
                    pointsMat.opacity = 0.92;
                    header.style.transition = 'opacity 1.1s ease';
                    header.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    mode = 'idle';
                }
            } else if (mode === 'idle') {
                writeTempleStars(dt);
                camTarget.x = pointer.x * 1.25;
                camTarget.y = -pointer.y * 0.72;
            } else if (mode === 'exit') {
                const progress = Math.min((time - phaseStart) / EXIT_MS, 1);
                const ease = progress * progress * progress;
                writeStreaks(8 + ease * 110, 60 + ease * 520, dt);
                streakMat.opacity = 0.55 + ease * 0.45;
                camera.fov = BASE_FOV + ease * 48;
                camera.updateProjectionMatrix();
                temple.scale.setScalar(Math.max(0.001, 1 - ease));
                header.style.opacity = String(1 - ease);
                camTarget.x = 0;
                camTarget.y = 0;
                if (flash) flash.style.opacity = String(Math.max(0, (progress - 0.4) / 0.6));
                if (progress >= 1) {
                    window.location.href = 'index.html';
                    mode = 'gone';
                }
            }

            camera.position.x += (camTarget.x - camera.position.x) * 0.045;
            camera.position.y += (camTarget.y - camera.position.y) * 0.045;
            camera.lookAt(0, 0.2, -30);

            rings.forEach((mesh) => {
                const spec = mesh.userData;
                const pivot = mesh.parent;
                mesh.rotation.z += spec.speed * dt;
                const sway = Math.sin(time * spec.freq) * spec.wobble;
                pivot.rotation.x = spec.tiltX + sway;
                pivot.rotation.y = spec.tiltY + sway * 0.45;
            });
            halo.rotation.z += 0.00035 * dt;
            halo.rotation.y = Math.sin(time * 0.00022) * 0.05;
            logo.position.y = Math.sin(time * 0.0009) * 0.08;

            renderer.render(scene, camera);
        }

        startLoop(animate);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopLoop();
                lastFrameTime = 0;
            } else {
                startLoop(animate);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            layoutTemple();
        });
    </script>
</body>

</html>
